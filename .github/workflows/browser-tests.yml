name: Browser tests

on:
  workflow_call:

jobs:
  # Runs once per run: the Playwright image, the affected specs and the shards as a matrix
  # (web/scripts/ci/select-browser-shards.ts, browser-matrix.ts). Listing the specs needs the
  # frontend dependencies but no browsers, so this job runs on the plain runner.
  select:
    name: Select browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: ci-browser-select-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && github.ref || github.run_id }}
      cancel-in-progress: true
    outputs:
      image: ${{ steps.version.outputs.image }}
      matrix: ${{ steps.select.outputs.matrix }}
      run: ${{ steps.select.outputs.run }}
    steps:
      # Two commits on pull requests: the first parent of the merge commit is the base the
      # affected specs are computed against (scripts/ci/select-affected.ts).
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      - name: Read the Playwright version from web/package.json
        id: version
        run: |
          version=$(node -p "require('./web/package.json').devDependencies['@playwright/test'] || require('./web/package.json').dependencies['@playwright/test']")
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::@playwright/test in web/package.json must be an exact version, found: $version"
            exit 1
          fi
          echo "image=mcr.microsoft.com/playwright:v${version}-noble" >> "$GITHUB_OUTPUT"
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            web/node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - name: Install frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Select the specs and shards
        id: select
        working-directory: web
        env:
          # Pull requests run the specs their change can affect; main and other triggers run all
          E2E_AFFECTED_BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
        run: bun scripts/ci/select-browser-shards.ts

  browser-tests:
    needs: select
    # Without affected specs no browser job starts; the run still succeeds, because a skipped
    # job counts as passed for the result of this workflow
    if: needs.select.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: ${{ needs.select.outputs.image }}
      options: --init --ipc=host
    defaults:
      run:
        shell: bash
    name: Browser tests (${{ matrix.name }})
    # A group per shard, so the shards of one run do not cancel each other
    concurrency:
      group: ci-browser-tests-${{ matrix.group }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && github.ref || github.run_id }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      # Chromium shards balanced on their estimated wall time (at most twelve), and WebKit when
      # one of its specs is affected; each entry carries its own list of project/files
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          check-latest: true
      # setup-bun needs unzip, which the Playwright image does not include.
      # npm installs the native Bun package without adding Ubuntu system packages.
      - name: Install Bun
        run: |
          npm install --global bun@1.4.2
          test "$(bun --version)" = "1.4.2"
      - name: Install frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Check Playwright image version
        working-directory: web
        env:
          PLAYWRIGHT_IMAGE: ${{ needs.select.outputs.image }}
        run: |
          version=$(node -p "require('@playwright/test/package.json').version")
          test "$PLAYWRIGHT_IMAGE" = "mcr.microsoft.com/playwright:v${version}-noble"
      # Each shard builds the site with the test data itself (about 7 s). A shared build job would
      # start its own container before any shard, and the artifact of build-web holds the live
      # content on main.
      - name: Build the site with the test data
        working-directory: web
        run: bun run build
        env:
          CONTENT_SOURCE: mock
          # A source that cannot be baked fails the build instead of the baked-content specs
          CONTENT_STRICT: "1"
      - name: Write the specs of this shard
        working-directory: web
        env:
          TESTS: ${{ matrix.tests }}
        run: |
          mkdir -p test-results
          printf '%s\n' "$TESTS" > test-results/shard.txt
          cat test-results/shard.txt
      - name: Test browser workflows with simulated data
        working-directory: web
        # Each shard runs its share of the test files against the built site, one server with the
        # demo API per worker (scripts/serve-built.ts, started by scripts/e2e-servers.ts)
        run: bun run test:e2e ${{ matrix.args }}
        env:
          E2E_SERVER: built
          E2E_WORKERS: ${{ matrix.workers }}
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/results.json
      - name: List failed and flaky tests
        # Never fails the job; a shard without tests or report writes nothing
        if: always()
        continue-on-error: true
        working-directory: web
        run: bun scripts/ci/flaky-summary.ts test-results/results.json "${{ matrix.name }}"
      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-report-${{ matrix.browser }}-${{ strategy.job-index }}
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7

  # Tests tagged @dev-server load source modules of the dev server (web/e2e-projects.ts), which
  # the built site has not; the shards leave them out. Only when the selection holds their files.
  dev-server:
    needs: select
    if: >-
      needs.select.outputs.run == 'true' &&
      contains(needs.select.outputs.matrix, 'nikolaus-offline.spec.ts')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: ${{ needs.select.outputs.image }}
      options: --init --ipc=host
    defaults:
      run:
        shell: bash
        working-directory: web
    name: Browser tests (dev server)
    concurrency:
      group: ci-browser-dev-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && github.ref || github.run_id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          check-latest: true
      - name: Install Bun and frontend dependencies
        run: |
          npm install --global bun@1.4.2
          test "$(bun --version)" = "1.4.2"
          bun install --frozen-lockfile
      - name: Test browser workflows on the dev server
        run: bun run test:e2e --project=desktop --grep @dev-server
        env:
          E2E_WORKERS: "2"
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/results.json
      - name: List failed and flaky tests
        if: always()
        continue-on-error: true
        run: bun scripts/ci/flaky-summary.ts test-results/results.json "dev server"
      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-report-dev-server
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
