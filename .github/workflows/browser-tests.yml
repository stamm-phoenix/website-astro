name: Browser tests

on:
  workflow_call:

jobs:
  playwright-image:
    name: Playwright image
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      image: ${{ steps.version.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: web/package.json
          sparse-checkout-cone-mode: false
      - name: Read the Playwright version from web/package.json
        id: version
        run: |
          version=$(node -p "require('./web/package.json').devDependencies['@playwright/test'] || require('./web/package.json').dependencies['@playwright/test']")
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::@playwright/test in web/package.json must be an exact version, found: $version"
            exit 1
          fi
          echo "image=mcr.microsoft.com/playwright:v${version}-noble" >> "$GITHUB_OUTPUT"

  browser-tests:
    needs: playwright-image
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.playwright-image.outputs.image }}
      options: --init --ipc=host
    defaults:
      run:
        shell: bash
    name: Browser tests (${{ matrix.name }})
    # A group per shard, so the shards of one run do not cancel each other
    concurrency:
      group: ci-browser-tests-${{ matrix.name }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && github.ref || github.run_id }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        # Twelve balanced Chromium jobs target a full deployment within ten minutes.
        include:
          - {
              name: "1/12",
              browser: chromium,
              args: "--project=desktop --project=mobile --test-list=test-results/shard.txt",
              shard: "1/12",
            }
          - {
              name: "2/12",
              browser: chromium,
              args: "--project=desktop --project=mobile --test-list=test-results/shard.txt",
              shard: "2/12",
            }
          - {
              name: "3/12",
              browser: chromium,
              args: "--project=desktop --project=mobile --test-list=test-results/shard.txt",
              shard: "3/12",
            }
          - {
              name: "4/12",
              browser: chromium,
              args: "--project=desktop --project=mobile --test-list=test-results/shard.txt",
              shard: "4/12",
            }
          - {
              name: "5/12",
              browser: chromium,
              args: "--project=desktop --project=mobile --test-list=test-results/shard.txt",
              shard: "5/12",
            }
          - {
              name: "6/12",
              browser: chromium,
              args: "--project=desktop --project=mobile --test-list=test-results/shard.txt",
              shard: "6/12",
            }
          - {
              name: "7/12",
              browser: chromium,
              args: "--project=desktop --project=mobile --test-list=test-results/shard.txt",
              shard: "7/12",
            }
          - {
              name: "8/12",
              browser: chromium,
              args: "--project=desktop --project=mobile --test-list=test-results/shard.txt",
              shard: "8/12",
            }
          - {
              name: "9/12",
              browser: chromium,
              args: "--project=desktop --project=mobile --test-list=test-results/shard.txt",
              shard: "9/12",
            }
          - {
              name: "10/12",
              browser: chromium,
              args: "--project=desktop --project=mobile --test-list=test-results/shard.txt",
              shard: "10/12",
            }
          - {
              name: "11/12",
              browser: chromium,
              args: "--project=desktop --project=mobile --test-list=test-results/shard.txt",
              shard: "11/12",
            }
          - {
              name: "12/12",
              browser: chromium,
              args: "--project=desktop --project=mobile --test-list=test-results/shard.txt",
              shard: "12/12",
            }
          # Run the small WebKit suite with one worker and one dev server.
          - {
              name: "WebKit",
              browser: webkit,
              args: "--project=webkit-tablet --test-list=test-results/shard.txt",
              workers: 1,
            }
    steps:
      # Two commits on pull requests: the first parent of the merge commit is the base the
      # affected specs are computed against (scripts/ci/select-affected.ts).
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          check-latest: true
      # setup-bun needs unzip, which the Playwright image does not include.
      # npm installs the native Bun package without adding Ubuntu system packages.
      - name: Install Bun
        run: |
          npm install --global bun@1.4.2
          test "$(bun --version)" = "1.4.2"
      - name: Install frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Check Playwright image version
        working-directory: web
        env:
          PLAYWRIGHT_IMAGE: ${{ needs.playwright-image.outputs.image }}
        run: |
          version=$(node -p "require('@playwright/test/package.json').version")
          test "$PLAYWRIGHT_IMAGE" = "mcr.microsoft.com/playwright:v${version}-noble"
      - name: Select the specs of this shard
        id: select
        working-directory: web
        env:
          # Pull requests run the specs their change can affect; main and other triggers run all
          E2E_AFFECTED_BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
        run: |
          # The container user does not own the checkout; without this git does not see the repository
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ "${{ matrix.browser }}" = chromium ]; then
            bun scripts/ci/select-browser-shard.ts ${{ matrix.shard }}
          else
            bun scripts/ci/select-browser-shard.ts 1/1 webkit-tablet
          fi
      - name: Test browser workflows with simulated data
        # A shard without affected specs still succeeds, so "All shards passed" stays complete
        if: steps.select.outputs.run == 'true'
        working-directory: web
        # Each shard runs its share of the test files with one mock dev server per worker.
        run: bun run test:e2e ${{ matrix.args }}
        env:
          E2E_WORKERS: ${{ matrix.workers || 4 }}
      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-report-${{ matrix.browser }}-${{ strategy.job-index }}
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
