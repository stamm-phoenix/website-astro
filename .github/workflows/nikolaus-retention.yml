name: Nikolaus data retention
on:
  schedule:
    - cron: "39 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only calculate a preview; do not write or delete"
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  retention:
    if: github.ref == 'refs/heads/main' && (vars.NIKOLAUS_RETENTION_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && inputs.dry_run))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: nikolaus-retention
    concurrency:
      group: website-astro-deployment-and-retention
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install API dependencies
        working-directory: api
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Check due seasons and run configured retention
        working-directory: api
        env:
          NIKOLAUS_RETENTION_ENABLED: ${{ vars.NIKOLAUS_RETENTION_ENABLED }}
          NIKOLAUS_RETENTION_TARGET_DIGEST: ${{ vars.NIKOLAUS_RETENTION_TARGET_DIGEST }}
          RETENTION_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          # The database comes from api/lib/config.ts; the website app registration reads and deletes.
          AZURE_CLIENT_CERT: ${{ secrets.AZURE_CLIENT_CERT }}
        run: |
          if [ "$RETENTION_DRY_RUN" = "true" ]; then
            bun scripts/nikolaus-retention-auto.ts --dry-run
          else
            bun scripts/nikolaus-retention-auto.ts
          fi
