name: Codex Review
# AI review of pull requests with Codex and model deployments on our Azure OpenAI resource (paid
# by the Azure grant). Every new or updated PR gets a review with gpt-6.1-sol; the label
# "codex-review" starts a thorough review with gpt-6-astra. Setup and costs: docs/ki-review.md.
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize, labeled]
permissions:
  contents: read
env:
  # Names of the model deployments in Azure (website-astro-openai)
  CODEX_MODEL: ${{ github.event.action == 'labeled' && 'gpt-6-astra' || 'gpt-6.1-sol' }}
  # The automatic review thinks hard, the thorough one as hard as Codex can (it runs rarely and
  # does not hold up the queue of the automatic reviews)
  CODEX_EFFORT: ${{ github.event.action == 'labeled' && 'xhigh' || 'high' }}
  THOROUGH: ${{ github.event.action == 'labeled' }}
# A new push cancels the running automatic review of the same PR. A thorough review gets a group
# of its own per PR and label: a push does not cancel it, a second label waits for it, and other
# labels (which start skipped runs, because concurrency applies before the job's `if`) do not
# replace a waiting one.
concurrency:
  group: codex-review-${{ github.event.pull_request.number }}${{ github.event.action == 'labeled' && format('-{0}', github.event.label.name) || '' }}
  cancel-in-progress: ${{ github.event.action != 'labeled' }}
jobs:
  review:
    # Only pull_request events: they run without secrets for PRs from forks, so code from a PR
    # never runs next to the key. Fork PRs and bots (Dependabot) are skipped because they get no
    # secrets anyway; labels can only be set by people with write access.
    if: >-
      github.event.sender.type != 'Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action != 'labeled' || github.event.label.name == 'codex-review')
    # Reviews of all PRs share the rate limit (tokens per minute) of the model deployment, so only
    # one review per deployment runs at a time; the others wait in order (`queue: max`, up to 100)
    # instead of failing with "exceeded token rate limit". A push still cancels a waiting automatic
    # review through the concurrency of the workflow above. Only github/needs/vars are available
    # here, not env, so the model is derived from the event like CODEX_MODEL.
    concurrency:
      group: codex-review-model-${{ github.event.action == 'labeled' && 'gpt-6-astra' || 'gpt-6.1-sol' }}
      queue: max
    # The name tells the automatic review that a thorough one of the same commit exists
    name: ${{ github.event.action == 'labeled' && 'Thorough review' || 'Review' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      review: ${{ steps.codex.outputs.final-message }}
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      # A label set together with a push (or while the automatic review waits) starts a thorough
      # review of the same commit; the automatic one would only repeat it and hold the queue.
      # A thorough review that failed or was cancelled does not count.
      - name: Skip if a thorough review of this commit exists
        id: thorough
        if: env.THOROUGH != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        # Only runs of this PR's branch: another PR may point at the same commit, and its review
        # is posted there. The runs list of the API leaves pull_requests empty for many PRs.
        run: |
          found=false
          for run in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/codex-review.yml/runs?head_sha=$HEAD_SHA&per_page=100" \
            --jq '.workflow_runs[] | select(.head_branch == env.HEAD_REF) | .id'); do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs" \
              --jq '.jobs[] | select(.name == "Thorough review" and (.conclusion == null or .conclusion == "success")) | .id' | grep -q .; then
              found=true
              echo "::notice::Run $run reviews this commit thoroughly; skipping the automatic review."
              break
            fi
          done
          echo "found=$found" >> "$GITHUB_OUTPUT"

      # The PR head, so that the line numbers of the findings match the diff
      - uses: actions/checkout@v4
        if: steps.thorough.outputs.found != 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      # Codex runs without network access and without a GitHub token, so everything it needs
      # from GitHub is fetched here into files
      - name: PR context
        if: steps.thorough.outputs.found != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          dir="$RUNNER_TEMP/pr"
          mkdir -p "$dir"
          gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json title,body \
            --template '{{.title}}{{"\n\n"}}{{.body}}' > "$dir/description.md"
          # The diff of exactly the checked-out commit (`gh pr diff` would give the PR's current
          # head, which differs from the checkout if someone pushed after the run started)
          gh api "repos/$GITHUB_REPOSITORY/compare/$BASE_SHA...$HEAD_SHA" \
            -H "Accept: application/vnd.github.diff" > "$dir/diff.patch"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/comments" --paginate \
            --jq '.[] | {path, line, author: .user.login, body}' > "$dir/review-comments.jsonl"

      # A single review of a large PR exceeds the tokens per minute of the deployment, which cannot
      # be raised, and Codex gives up after a few seconds. The proxy waits out the limit instead
      # (details in the script); Codex goes through it via responses-api-endpoint below.
      - name: Rate limit proxy
        if: steps.thorough.outputs.found != 'true'
        run: |
          nohup node .github/scripts/rate-limit-proxy.mjs 8788 \
            https://website-astro-openai.openai.azure.com/openai/v1/responses \
            "$RUNNER_TEMP/rate-limit-proxy.log" > /dev/null 2>&1 &
          for _ in $(seq 1 50); do
            grep -q listening "$RUNNER_TEMP/rate-limit-proxy.log" 2>/dev/null && exit 0
            sleep 0.1
          done
          echo "The rate limit proxy did not start" >&2
          exit 1

      - name: Codex
        id: codex
        if: steps.thorough.outputs.found != 'true'
        # v1.13, pinned to the commit because the action gets the Azure key
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675
        with:
          openai-api-key: ${{ secrets.AZURE_OPENAI_REVIEW_KEY }}
          # The rate limit proxy, which forwards to https://website-astro-openai.openai.azure.com
          responses-api-endpoint: http://127.0.0.1:8788/openai/v1/responses
          model: ${{ env.CODEX_MODEL }}
          effort: ${{ env.CODEX_EFFORT }}
          permission-profile: ":read-only"
          prompt: |
            Du prüfst Pull Request #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            Der Stand des PRs ist im aktuellen Verzeichnis ausgecheckt. Du hast keinen Netzzugriff;
            alles von GitHub liegt in `${{ runner.temp }}/pr/`:
            - `description.md`: Titel und Beschreibung des PRs
            - `diff.patch`: der Diff des PRs gegen den Zielbranch
            - `review-comments.jsonl`: bisherige Kommentare an den Zeilen (eine Zeile JSON pro Kommentar)

            Schreibe alle Texte auf Deutsch.

            Vorgehen:
            1. Lies Beschreibung und Diff. Lockfiles (`bun.lock`, `package-lock.json`, `flake.lock`) und
               minifizierte Dateien überspringst du.
            2. Halte dich an AGENTS.md. Sie enthält die Regeln des Projekts (Astro 7, Svelte 5 Runes,
               Tailwind CSS 4, Azure Functions in api/, Azure SQL mit Migrationen, Usability für Leitende).
            3. Was in `review-comments.jsonl` schon steht (von dir oder anderen), meldest du nicht noch einmal.
            4. Suche nach echten Problemen: Fehler im Verhalten, Sicherheitslücken, Datenverlust, kaputte
               Migrationen und Verstöße gegen AGENTS.md. Achte besonders auf:
               - jeder neue `/api/intern/*`-Endpunkt beginnt mit `requireStaff(request)` (bzw. `requireNikolausStaff`);
                 Pflege-Schreibendpunkte nutzen `pflegeHandler` und prüfen Eingaben in `api/lib/pflege-validation.ts`
               - Migrationen sind neue Dateien, ändern keine bestehenden und bleiben rückwärtskompatibel;
                 neue Tabellen bekommen Testdaten in `api/scripts/db-preview.ts` und ein höheres `SEEDED_KEY`
               - `content.ts` wird nur im Frontmatter von Seiten importiert, nie in Islands; Sanitizer nutzen `parseHtml`
               - Barrierefreiheit (aria-labelledby, width/height an Bildern, ARIA an interaktiven Elementen)
               - Texte im Leitendenbereich: einfache Sprache in der Du-Form, Fehlermeldungen mit nächstem Schritt
            5. Prüfe jeden möglichen Fund im Code nach, bevor du ihn meldest: Lies die aufgerufenen Funktionen,
               Typen und Aufrufer. Melde nur, was du belegen kannst. Keine reinen Stilfragen, keine Vermutungen.

            Gib das Ergebnis im vorgegebenen Format zurück:
            - `summary`: ein bis drei Sätze Gesamteindruck (was der PR macht und ob er so in Ordnung ist).
            - `findings`: je Fund
              - `severity`: `kritisch` (Sicherheitslücke, Datenverlust, Ausfall), `fehler` (falsches Verhalten)
                oder `hinweis` (Verstoß gegen AGENTS.md, Barrierefreiheit, Wortwahl, kleines Risiko)
              - `category`: genau einer von Sicherheit, Funktion, Daten, Barrierefreiheit, Usability,
                Projektregeln, Performance
              - `title`: ein Satz, der das Problem benennt
              - `body`: zwei bis fünf Sätze Markdown: welche Eingabe oder welcher Zustand führt zu welchem
                falschen Ergebnis, und warum. Code, Dateien und Funktionen in `Backticks`.
              - `path`, `line`: Datei und Zeile im neuen Stand. Die Zeile muss im Diff vorkommen (hinzugefügt
                oder als Kontext in einem Abschnitt). `start_line`: erste Zeile, wenn der Fund mehrere Zeilen
                umfasst, sonst null.
              - `suggestion`: ersetzter Code für genau die Zeilen `start_line` bis `line` (bzw. nur `line`), ohne
                Markdown-Zaun, nur wenn die Lösung eindeutig ist und sich auf diese Zeilen beschränkt; sonst null.
              - `agent_prompt`: Anweisung für einen KI-Agenten: in welcher Datei um welche Zeile was geändert
                werden soll und warum, so dass er es ohne den Kommentar umsetzen kann; mit dem Hinweis, vorher
                zu prüfen, ob das Problem noch besteht.
          output-schema: |
            {
              "type": "object",
              "additionalProperties": false,
              "required": ["summary", "findings"],
              "properties": {
                "summary": { "type": "string" },
                "findings": {
                  "type": "array",
                  "items": {
                    "type": "object",
                    "additionalProperties": false,
                    "required": ["severity", "category", "title", "body", "path", "line", "start_line", "suggestion", "agent_prompt"],
                    "properties": {
                      "severity": { "type": "string", "enum": ["kritisch", "fehler", "hinweis"] },
                      "category": { "type": "string" },
                      "title": { "type": "string" },
                      "body": { "type": "string" },
                      "path": { "type": "string" },
                      "line": { "type": "integer" },
                      "start_line": { "type": ["integer", "null"] },
                      "suggestion": { "type": ["string", "null"] },
                      "agent_prompt": { "type": "string" }
                    }
                  }
                }
              }
            }

      # How often and how long the proxy waited, to tune the limits
      - name: Rate limit proxy log
        if: always()
        run: cat "$RUNNER_TEMP/rate-limit-proxy.log" 2>/dev/null || true

      # The job keeps its place in the concurrency group a little longer, so the next review of the
      # same deployment does not start right into the limit per minute that this one used up. The
      # proxy waits out the rest (Azure asks for about 11 s per wait); also after a failure, which
      # may be the limit itself.
      - name: Pause for the rate limit
        if: always() && steps.codex.outcome != 'skipped'
        run: sleep 20

  # Posting runs in a job of its own: it needs write access, the Codex job must not have it
  comment:
    needs: review
    if: needs.review.outputs.review != ''
    # An automatic and a thorough review of the same PR can finish at the same time; one after the
    # other, the second finds the summary comment of the first instead of creating another one
    concurrency:
      group: codex-review-comment-${{ github.event.pull_request.number }}
      queue: max
    runs-on: ubuntu-24.04
    permissions:
      # Review comments, the summary comment on the PR and removing the label
      pull-requests: write
    steps:
      - name: Post review
        # v8.0.0
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          REVIEW: ${{ needs.review.outputs.review }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const MARKER = '<!-- codex-review-summary -->';
            let review;
            try {
              review = JSON.parse(process.env.REVIEW);
            } catch (error) {
              core.setFailed(`Codex returned no valid JSON (${error.message}): ${process.env.REVIEW.slice(0, 500)}`);
              return;
            }
            const sha = process.env.HEAD_SHA;
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            const icons = { kritisch: '🔴', fehler: '🟠', hinweis: '🟡' };
            const labels = { kritisch: 'Kritisch', fehler: 'Fehler', hinweis: 'Hinweis' };
            const order = ['kritisch', 'fehler', 'hinweis'];
            const findings = [...(review.findings ?? [])].sort(
              (a, b) => order.indexOf(a.severity) - order.indexOf(b.severity),
            );

            // One comment per finding: severity and area, title, reasoning, suggestion, agent prompt
            const commentBody = (f) => {
              const parts = [
                `**${icons[f.severity]} ${labels[f.severity]}** · ${f.category}`,
                `**${f.title}**`,
                f.body,
              ];
              if (f.suggestion !== null && f.suggestion !== undefined) {
                parts.push('```suggestion\n' + f.suggestion.replace(/\n$/, '') + '\n```');
              }
              parts.push(
                '<details>\n<summary>🤖 Prompt für KI-Agenten</summary>\n\n```\n' +
                  f.agent_prompt +
                  '\n```\n\n</details>',
              );
              return parts.join('\n\n');
            };
            const toComment = (f) => ({
              path: f.path,
              line: f.line,
              side: 'RIGHT',
              ...(f.start_line && f.start_line < f.line ? { start_line: f.start_line, start_side: 'RIGHT' } : {}),
              body: commentBody(f),
            });

            // All findings as one GitHub review; if GitHub rejects it (e.g. a line outside the diff),
            // each finding on its own, and the ones that still fail only go into the summary
            const notPosted = [];
            if (findings.length > 0) {
              try {
                await github.rest.pulls.createReview({
                  owner, repo, pull_number, commit_id: sha, event: 'COMMENT',
                  comments: findings.map(toComment),
                });
              } catch (error) {
                core.warning(`Review with all comments failed: ${error.message}`);
                for (const f of findings) {
                  try {
                    await github.rest.pulls.createReviewComment({ owner, repo, pull_number, commit_id: sha, ...toComment(f) });
                  } catch (singleError) {
                    core.warning(`Comment on ${f.path}:${f.line} failed: ${singleError.message}`);
                    notPosted.push(f);
                  }
                }
              }
            }

            const cell = (text) => String(text).replace(/\|/g, '\\|').replace(/\n/g, ' ');
            const link = (f) => {
              const url = `${context.payload.repository.html_url}/blob/${sha}/${f.path}#L${f.line}`;
              return `[\`${cell(f.path)}:${f.line}\`](${url})`;
            };
            const counts = order
              .map((s) => [s, findings.filter((f) => f.severity === s).length])
              .filter(([, n]) => n > 0)
              .map(([s, n]) => `${icons[s]} ${n} ${labels[s]}`)
              .join(' · ');
            const lines = [MARKER, `## 🤖 Codex-Review${process.env.THOROUGH === 'true' ? ' (gründlich)' : ''}`, '', review.summary, ''];
            if (findings.length === 0) {
              lines.push('✅ **Keine neuen Funde.**');
            } else {
              lines.push(`**${findings.length} neue${findings.length === 1 ? 'r Fund' : ' Funde'}:** ${counts}`, '');
              lines.push('| | Fund | Bereich | Stelle |', '| :-: | --- | --- | --- |');
              for (const f of findings) {
                lines.push(`| ${icons[f.severity]} | ${cell(f.title)} | ${cell(f.category)} | ${link(f)} |`);
              }
              lines.push('', 'Details stehen in den Kommentaren an den Zeilen.');
              for (const f of notPosted) {
                lines.push('', '---', '', `Konnte nicht an die Zeile gesetzt werden (${link(f)}):`, '', commentBody(f));
              }
            }
            lines.push('', `<sub>Geprüfter Stand: ${sha.slice(0, 7)} · ${process.env.CODEX_MODEL} · Gründliches Review mit gpt-6-astra: Label \`codex-review\` setzen</sub>`);
            const body = lines.join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pull_number });
            const existing = comments.find((c) => c.user?.type === 'Bot' && c.body?.startsWith(MARKER));
            // A thorough review keeps running after a push; when it finishes after the review of the
            // new head, it must not replace that summary (its line comments are posted anyway)
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number });
            const head = pr.head.sha;
            if (existing && sha !== head && existing.body.includes(`Geprüfter Stand: ${head.slice(0, 7)}`)) {
              core.notice(`The summary already shows the review of ${head.slice(0, 7)}; keeping it.`);
            } else if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pull_number, body });
            }

      # The label only starts the thorough review; removing it shows that the review is done and
      # lets the next one start by setting it again. It stays after a failed review (this job does
      # not run then), so that it is clear the thorough review is still missing.
      - name: Remove label
        if: env.THOROUGH == 'true'
        # v8.0.0
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({
                ...context.repo,
                issue_number: context.payload.pull_request.number,
                name: 'codex-review',
              });
            } catch (error) {
              // Someone removed it in the meantime
              if (error.status !== 404) throw error;
            }
