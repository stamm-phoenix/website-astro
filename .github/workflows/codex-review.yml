name: Codex Review
# AI review of pull requests with Codex and the model deployment gpt-6.1-sol on our Azure OpenAI
# resource (paid by the Azure grant). A review only runs on request: when a PR is marked ready for
# review, or when someone sets the label "codex-review". Pushes start no review. After every
# review the workflow removes the label again; set it again for the next review. This file is the
# same in website-astro and playwright-api; what to look for in each repo is in
# .github/review-instructions.md. Setup and costs: docs/ki-review.md.
# The run name tells the skip and label steps which runs were started by the label for which PR
# (the runs list of the API leaves pull_requests empty for many PRs). Runs for other labels do
# not get the suffix, so they are never mistaken for a requested review.
run-name: "${{ format('Review #{0}{1}', github.event.pull_request.number, github.event.action == 'labeled' && github.event.label.name == 'codex-review' && ' (Label)' || '') }}"
on:
  pull_request:
    types: [ready_for_review, labeled]
permissions:
  contents: read
env:
  # Name in the comments and label that starts a review (also the name of this file)
  REVIEWER: Codex
  LABEL: codex-review
  # Name of the model deployment in Azure (website-astro-openai, shared by website-astro and
  # playwright-api) and how hard Codex thinks
  MODEL: gpt-6.1-sol
  CODEX_EFFORT: medium
# One review per PR at a time; further requests wait for the running one in order (`queue: max`,
# without it a third request would replace the waiting second one). Other labels start runs that
# are skipped (concurrency applies before the job's `if`); they get a group of their own so they
# do not wait for or replace a review.
concurrency:
  group: codex-review-${{ github.event.pull_request.number }}${{ github.event.action == 'labeled' && github.event.label.name != 'codex-review' && format('-other-{0}', github.event.label.name) || '' }}
  cancel-in-progress: false
  queue: max
jobs:
  review:
    # Only pull_request events: they run without secrets for PRs from forks, so code from a PR
    # never runs next to the key. Fork PRs are skipped because they get no secrets anyway; labels can
    # only be set by people with write access. PRs of bots (Dependabot) are skipped too, also when a
    # person sets the label (the sender of a `labeled` event is whoever set the label).
    if: >-
      github.event.sender.type != 'Bot' &&
      github.event.pull_request.user.type != 'Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action == 'ready_for_review' || github.event.label.name == 'codex-review')
    # Reviews of all PRs share the rate limit (tokens per minute) of the model deployment, so only
    # one review runs at a time; the others wait in order (`queue: max`, up to 100) instead of
    # failing with "exceeded token rate limit".
    concurrency:
      group: codex-review-model-gpt-6.1-sol
      queue: max
    name: Review
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      review: ${{ steps.codex.outputs.final-message }}
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      # A PR marked ready for review together with the label would be reviewed twice. The label
      # wins: the ready_for_review run skips when a label review of the same commit runs, waits
      # or succeeded. A run that is not completed counts even without jobs (it may still wait
      # for this one in the concurrency group of the PR). A failed or cancelled one does not
      # count, nor one whose comments could not be posted.
      - name: Skip if a label review of this commit exists
        id: duplicate
        if: github.event.action == 'ready_for_review'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LABEL_TITLE: "Review #${{ github.event.pull_request.number }} (Label)"
        # Only runs of this PR: another PR may point at the same commit (also from the same branch,
        # against another base), and its review is posted there
        run: |
          found=false
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$LABEL.yml/runs?head_sha=$HEAD_SHA&per_page=100" \
            --jq '.workflow_runs[] | select(.display_title == env.LABEL_TITLE) | "\(.id) \(.status)"')
          while read -r run status; do
            [ -n "$run" ] || continue
            if [ "$status" != completed ] && [ "$run" != "$GITHUB_RUN_ID" ]; then
              found=true
              echo "::notice::Run $run reviews this commit (label) and has not finished; skipping."
              break
            fi
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs" \
              --jq 'select(any(.jobs[]; .name == "Review" and (.conclusion == null or .conclusion == "success"))
                and all(.jobs[]; .name != "comment" or .conclusion == null or .conclusion == "success" or .conclusion == "skipped")) | .total_count' | grep -q .; then
              found=true
              echo "::notice::Run $run reviewed this commit (label); skipping."
              break
            fi
          done <<< "$runs"
          echo "skip=$found" >> "$GITHUB_OUTPUT"

      # PRs that only change documentation, lockfiles or the changelog need no review. Checked
      # here instead of with `paths-ignore`, so that the label is still removed afterwards. The
      # files come from the same comparison as the diff below (the commit of the event, not the
      # PR's current head), written to a file first so that a failed request fails the step
      # instead of looking like a PR without code. A renamed file counts with its old path too,
      # so that code moved into docs/ is still reviewed. GitHub lists at most 300 files there; a
      # PR that large is reviewed.
      - name: Skip if only docs, lockfiles or the changelog changed
        id: files
        if: steps.duplicate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/compare/$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/compare.json"
          jq -r '.files[] | .filename, (.previous_filename // empty)' "$RUNNER_TEMP/compare.json" > "$RUNNER_TEMP/files.txt"
          relevant=false
          if [ "$(jq '.files | length' "$RUNNER_TEMP/compare.json")" -ge 300 ]; then relevant=true; fi
          while IFS= read -r file; do
            case "$file" in
              *.md | docs/* | */docs/* | bun.lock | */bun.lock | package-lock.json | */package-lock.json | web/src/lib/changelogEntries.ts) ;;
              *) relevant=true; break ;;
            esac
          done < "$RUNNER_TEMP/files.txt"
          if [ "$relevant" != true ]; then
            echo "::notice::The PR only changes documentation, lockfiles or the changelog; skipping the review."
          fi
          echo "review=$relevant" >> "$GITHUB_OUTPUT"

      # The PR head, so that the line numbers of the findings match the diff
      - uses: actions/checkout@v7
        if: steps.files.outputs.review == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      # The reviewer gets no network access and no GitHub token, so everything it needs from
      # GitHub is fetched here into files
      - name: PR context
        if: steps.files.outputs.review == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          dir="$RUNNER_TEMP/pr"
          mkdir -p "$dir"
          gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json title,body \
            --template '{{.title}}{{"\n\n"}}{{.body}}' > "$dir/description.md"
          # The diff of exactly the checked-out commit (`gh pr diff` would give the PR's current
          # head, which differs from the checkout if someone pushed after the run started)
          gh api "repos/$GITHUB_REPOSITORY/compare/$BASE_SHA...$HEAD_SHA" \
            -H "Accept: application/vnd.github.diff" > "$dir/diff.patch"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/comments" --paginate \
            --jq '.[] | {path, line, author: .user.login, body}' > "$dir/review-comments.jsonl"

      # A single review of a large PR can exceed the tokens per minute of the deployment, and Codex
      # gives up after a few seconds. The proxy waits out the limit instead (details in the
      # script); Codex goes through it via responses-api-endpoint below.
      - name: Rate limit proxy
        if: steps.files.outputs.review == 'true'
        run: |
          nohup node .github/scripts/rate-limit-proxy.mjs 8788 \
            https://website-astro-openai.openai.azure.com/openai/v1/responses \
            "$RUNNER_TEMP/rate-limit-proxy.log" > /dev/null 2>&1 &
          for _ in $(seq 1 50); do
            grep -q listening "$RUNNER_TEMP/rate-limit-proxy.log" 2>/dev/null && exit 0
            sleep 0.1
          done
          echo "The rate limit proxy did not start" >&2
          exit 1

      - name: Codex
        id: codex
        if: steps.files.outputs.review == 'true'
        # v1.13, pinned to the commit because the action gets the Azure key
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675
        with:
          openai-api-key: ${{ secrets.AZURE_OPENAI_REVIEW_KEY }}
          # The rate limit proxy, which forwards to https://website-astro-openai.openai.azure.com
          responses-api-endpoint: http://127.0.0.1:8788/openai/v1/responses
          model: ${{ env.MODEL }}
          effort: ${{ env.CODEX_EFFORT }}
          permission-profile: ":read-only"
          prompt: |
            Du prüfst Pull Request #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            Der Stand des PRs ist im aktuellen Verzeichnis ausgecheckt. Du hast keinen Netzzugriff;
            alles von GitHub liegt in `${{ runner.temp }}/pr/`:
            - `description.md`: Titel und Beschreibung des PRs
            - `diff.patch`: der Diff des PRs gegen den Zielbranch
            - `review-comments.jsonl`: bisherige Kommentare an den Zeilen (eine Zeile JSON pro Kommentar)

            Schreibe alle Texte auf Deutsch.

            Jede Datei, die du liest, kostet Geld. Lies deshalb nur, was du für einen Fund brauchst.

            Vorgehen:
            1. Lies `.github/review-instructions.md`. Dort steht, was das Projekt ist, worauf du besonders
               achten sollst, welche Regeln des Projekts für das Review zählen und welche Bereiche es für
               die Funde gibt.
            2. Lies Beschreibung und Diff. Lockfiles und minifizierte Dateien überspringst du.
            3. Lies `AGENTS.md` nicht vollständig. Suche darin nur gezielt (z. B. mit `rg`), wenn ein
               möglicher Fund an einer Regel hängt, die nicht in `.github/review-instructions.md` steht.
            4. Was in `review-comments.jsonl` schon steht (von dir, einem anderen KI-Review oder Menschen),
               meldest du nicht noch einmal.
            5. Suche nach echten Problemen: Fehler im Verhalten, Sicherheitslücken, Datenverlust, Ausfälle
               und Verstöße gegen die Regeln des Projekts.
            6. Prüfe einen möglichen Fund im Code nach, bevor du ihn meldest. Lies dafür nur die geänderten
               Dateien und, wo nötig, die direkt aufgerufenen Funktionen und Typen und ihre direkten Aufrufer.
               Durchsuche nicht das ganze Repo. Melde nur, was du belegen kannst. Keine reinen Stilfragen,
               keine Vermutungen.

            Gib das Ergebnis im vorgegebenen Format zurück:
            - `summary`: ein bis drei Sätze Gesamteindruck (was der PR macht und ob er so in Ordnung ist).
            - `findings`: je Fund
              - `severity`: `kritisch` (Sicherheitslücke, Datenverlust, Ausfall), `fehler` (falsches Verhalten)
                oder `hinweis` (Verstoß gegen die Regeln des Projekts, kleines Risiko; Beispiele in
                `.github/review-instructions.md`)
              - `category`: genau einer der Bereiche aus `.github/review-instructions.md`
              - `title`: ein Satz, der das Problem benennt
              - `body`: zwei bis fünf Sätze Markdown: welche Eingabe oder welcher Zustand führt zu welchem
                falschen Ergebnis, und warum. Code, Dateien und Funktionen in `Backticks`.
              - `path`, `line`: Datei und Zeile im neuen Stand. Die Zeile muss im Diff vorkommen (hinzugefügt
                oder als Kontext in einem Abschnitt). `start_line`: erste Zeile, wenn der Fund mehrere Zeilen
                umfasst, sonst null.
              - `suggestion`: ersetzter Code für genau die Zeilen `start_line` bis `line` (bzw. nur `line`), ohne
                Markdown-Zaun, nur wenn die Lösung eindeutig ist und sich auf diese Zeilen beschränkt; sonst null.
              - `agent_prompt`: Anweisung für einen KI-Agenten: in welcher Datei um welche Zeile was geändert
                werden soll und warum, so dass er es ohne den Kommentar umsetzen kann; mit dem Hinweis, vorher
                zu prüfen, ob das Problem noch besteht.
          output-schema: |
            {
              "type": "object",
              "additionalProperties": false,
              "required": ["summary", "findings"],
              "properties": {
                "summary": { "type": "string" },
                "findings": {
                  "type": "array",
                  "items": {
                    "type": "object",
                    "additionalProperties": false,
                    "required": ["severity", "category", "title", "body", "path", "line", "start_line", "suggestion", "agent_prompt"],
                    "properties": {
                      "severity": { "type": "string", "enum": ["kritisch", "fehler", "hinweis"] },
                      "category": { "type": "string" },
                      "title": { "type": "string" },
                      "body": { "type": "string" },
                      "path": { "type": "string" },
                      "line": { "type": "integer" },
                      "start_line": { "type": ["integer", "null"] },
                      "suggestion": { "type": ["string", "null"] },
                      "agent_prompt": { "type": "string" }
                    }
                  }
                }
              }
            }

      # How often and how long the proxy waited, to tune the limits
      - name: Rate limit proxy log
        if: always() && steps.files.outputs.review == 'true'
        run: cat "$RUNNER_TEMP/rate-limit-proxy.log" 2>/dev/null || true

      # The job keeps its place in the concurrency group a little longer, so the next review does
      # not start right into the limit per minute that this one used up. The proxy waits out the
      # rest (Azure asks for about 11 s per wait); also after a failure, which may be the limit
      # itself.
      - name: Pause for the rate limit
        if: always() && steps.codex.outcome != 'skipped'
        run: sleep 20

  # Posting runs in a job of its own: it needs write access, the review job must not have it
  comment:
    needs: review
    if: needs.review.outputs.review != ''
    # Two reviews of the same PR can finish shortly after each other; one after the other, the
    # second finds the summary comment of the first instead of creating another one.
    concurrency:
      group: review-comment-${{ github.event.pull_request.number }}
      queue: max
    runs-on: ubuntu-24.04
    permissions:
      # Review comments and the summary comment on the PR
      pull-requests: write
    steps:
      - name: Post review
        # v8.0.0
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          REVIEW: ${{ needs.review.outputs.review }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const MARKER = `<!-- ${process.env.LABEL}-summary -->`;
            let review;
            try {
              review = JSON.parse(process.env.REVIEW);
            } catch (error) {
              core.setFailed(`${process.env.REVIEWER} returned no valid JSON (${error.message}): ${process.env.REVIEW.slice(0, 500)}`);
              return;
            }
            const sha = process.env.HEAD_SHA;
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            const icons = { kritisch: '🔴', fehler: '🟠', hinweis: '🟡' };
            const labels = { kritisch: 'Kritisch', fehler: 'Fehler', hinweis: 'Hinweis' };
            const order = ['kritisch', 'fehler', 'hinweis'];
            // Two reviews of the same commit can report the same finding; the comment jobs run one
            // after the other, so the second skips what the first posted. Compared on the reviewed
            // commit: after a push GitHub moves `line` of older comments, `original_line` keeps the
            // line on the commit they were posted on. Findings of earlier commits the reviewer
            // already leaves out itself (review-comments.jsonl).
            const posted = await github.paginate(github.rest.pulls.listReviewComments, { owner, repo, pull_number });
            const isPosted = (f) =>
              posted.some(
                (c) =>
                  c.original_commit_id === sha &&
                  c.path === f.path &&
                  c.original_line === f.line &&
                  c.body?.includes(`**${f.title}**`),
              );
            const findings = (review.findings ?? [])
              .filter((f) => !isPosted(f))
              .sort((a, b) => order.indexOf(a.severity) - order.indexOf(b.severity));

            // One comment per finding: severity and area, title, reasoning, suggestion, agent prompt
            const commentBody = (f) => {
              const parts = [
                `**${icons[f.severity]} ${labels[f.severity]}** · ${f.category}`,
                `**${f.title}**`,
                f.body,
              ];
              if (f.suggestion !== null && f.suggestion !== undefined) {
                parts.push('```suggestion\n' + f.suggestion.replace(/\n$/, '') + '\n```');
              }
              parts.push(
                '<details>\n<summary>🤖 Prompt für KI-Agenten</summary>\n\n```\n' +
                  f.agent_prompt +
                  '\n```\n\n</details>',
              );
              return parts.join('\n\n');
            };
            const toComment = (f) => ({
              path: f.path,
              line: f.line,
              side: 'RIGHT',
              ...(f.start_line && f.start_line < f.line ? { start_line: f.start_line, start_side: 'RIGHT' } : {}),
              body: commentBody(f),
            });

            // All findings as one GitHub review; if GitHub rejects it (e.g. a line outside the diff),
            // each finding on its own, and the ones that still fail only go into the summary
            const notPosted = [];
            if (findings.length > 0) {
              try {
                await github.rest.pulls.createReview({
                  owner, repo, pull_number, commit_id: sha, event: 'COMMENT',
                  comments: findings.map(toComment),
                });
              } catch (error) {
                core.warning(`Review with all comments failed: ${error.message}`);
                for (const f of findings) {
                  try {
                    await github.rest.pulls.createReviewComment({ owner, repo, pull_number, commit_id: sha, ...toComment(f) });
                  } catch (singleError) {
                    core.warning(`Comment on ${f.path}:${f.line} failed: ${singleError.message}`);
                    notPosted.push(f);
                  }
                }
              }
            }

            const cell = (text) => String(text).replace(/\|/g, '\\|').replace(/\n/g, ' ');
            const link = (f) => {
              const url = `${context.payload.repository.html_url}/blob/${sha}/${f.path}#L${f.line}`;
              return `[\`${cell(f.path)}:${f.line}\`](${url})`;
            };
            const counts = order
              .map((s) => [s, findings.filter((f) => f.severity === s).length])
              .filter(([, n]) => n > 0)
              .map(([s, n]) => `${icons[s]} ${n} ${labels[s]}`)
              .join(' · ');
            const lines = [MARKER, `## 🤖 ${process.env.REVIEWER}-Review`, '', review.summary, ''];
            if (findings.length === 0) {
              lines.push('✅ **Keine neuen Funde.**');
            } else {
              lines.push(`**${findings.length} neue${findings.length === 1 ? 'r Fund' : ' Funde'}:** ${counts}`, '');
              lines.push('| | Fund | Bereich | Stelle |', '| :-: | --- | --- | --- |');
              for (const f of findings) {
                lines.push(`| ${icons[f.severity]} | ${cell(f.title)} | ${cell(f.category)} | ${link(f)} |`);
              }
              lines.push('', 'Details stehen in den Kommentaren an den Zeilen.');
              for (const f of notPosted) {
                lines.push('', '---', '', `Konnte nicht an die Zeile gesetzt werden (${link(f)}):`, '', commentBody(f));
              }
            }
            lines.push('', `<sub>Geprüfter Stand: ${sha.slice(0, 7)} · ${process.env.MODEL} · Neues Review: Label \`${process.env.LABEL}\` setzen</sub>`);
            const body = lines.join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pull_number });
            const existing = comments.find((c) => c.user?.type === 'Bot' && c.body?.startsWith(MARKER));
            // A review of an older commit that finishes after the review of the current head must not
            // replace that summary (its line comments are posted anyway)
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number });
            const head = pr.head.sha;
            if (existing && sha !== head && existing.body.includes(`Geprüfter Stand: ${head.slice(0, 7)}`)) {
              core.notice(`The summary already shows the review of ${head.slice(0, 7)}; keeping it.`);
            } else if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pull_number, body });
            }

  # The label only starts a review; it is removed after every review, also a failed, skipped or
  # cancelled one, so the next review starts by setting it again. When the label was set again
  # during this review, a newer run waits for this one (concurrency) and the label belongs to it.
  label:
    needs: [review, comment]
    if: >-
      always() &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'codex-review' &&
      github.event.sender.type != 'Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      # Removing the label
      pull-requests: write
      # Finding a newer label review of the same PR that waits for this one
      actions: read
    steps:
      - name: Remove label
        # v8.0.0
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              ...context.repo,
              workflow_id: `${process.env.LABEL}.yml`,
              branch: context.payload.pull_request.head.ref,
              event: 'pull_request',
              per_page: 100,
            });
            const newer = runs.find(
              (r) =>
                r.id > context.runId &&
                r.status !== 'completed' &&
                r.display_title === `Review #${context.payload.pull_request.number} (Label)`,
            );
            if (newer) {
              core.notice(`Run ${newer.id} reviews this PR again; keeping the label for it.`);
              return;
            }
            try {
              await github.rest.issues.removeLabel({
                ...context.repo,
                issue_number: context.payload.pull_request.number,
                name: process.env.LABEL,
              });
            } catch (error) {
              // Someone removed it in the meantime
              if (error.status !== 404) throw error;
            }
