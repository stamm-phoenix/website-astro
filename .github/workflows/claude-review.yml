name: Claude Review
# AI review of pull requests with Claude Code on the Anthropic API (paid from the monthly API
# credit). Every new or updated PR gets a review with claude-opus-5-5; the label "claude-review"
# starts a thorough review with claude-fable-5-1. Apart from the connection to the provider and
# the models, this file is the same as codex-review.yml, and both are the same in website-astro
# and playwright-api; what to look for in each repo is in .github/review-instructions.md. Setup
# and costs: docs/ki-review.md.
# The run name tells the label step which runs are thorough reviews
run-name: ${{ github.event.action == 'labeled' && github.event.label.name == 'claude-review' && 'Thorough review' || 'Review' }}
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize, labeled]
permissions:
  contents: read
env:
  # Name in the comments and label of the thorough review (also the name of this file)
  REVIEWER: Claude
  LABEL: claude-review
  MODEL: ${{ github.event.action == 'labeled' && 'claude-fable-5-1' || 'claude-opus-5-5' }}
  THOROUGH_MODEL: claude-fable-5-1
  THOROUGH: ${{ github.event.action == 'labeled' }}
# A new push cancels the running automatic review of the same PR. A thorough review gets a group
# of its own per PR and label: a push does not cancel it, a second label waits for it, and other
# labels (which start skipped runs, because concurrency applies before the job's `if`) do not
# replace a waiting one.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}${{ github.event.action == 'labeled' && format('-{0}', github.event.label.name) || '' }}
  cancel-in-progress: ${{ github.event.action != 'labeled' }}
jobs:
  review:
    # Only pull_request events: they run without secrets for PRs from forks, so code from a PR
    # never runs next to the key. Fork PRs are skipped because they get no secrets anyway; labels can
    # only be set by people with write access. PRs of bots (Dependabot) are skipped too, also when a
    # person sets the label (the sender of a `labeled` event is whoever set the label).
    if: >-
      github.event.sender.type != 'Bot' &&
      github.event.pull_request.user.type != 'Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action != 'labeled' || github.event.label.name == 'claude-review')
    # The name tells the automatic review that a thorough one of the same commit exists
    name: ${{ github.event.action == 'labeled' && 'Thorough review' || 'Review' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      review: ${{ steps.claude.outputs.structured_output }}
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      # A label set together with a push (or while the automatic review waits) starts a thorough
      # review of the same commit; the automatic one would only repeat it (and cost or wait twice).
      # A thorough review that failed or was cancelled does not count, nor one whose comments
      # could not be posted.
      - name: Skip if a thorough review of this commit exists
        id: thorough
        if: env.THOROUGH != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        # Only runs of this PR's branch: another PR may point at the same commit, and its review
        # is posted there. The runs list of the API leaves pull_requests empty for many PRs.
        run: |
          found=false
          for run in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$LABEL.yml/runs?head_sha=$HEAD_SHA&per_page=100" \
            --jq '.workflow_runs[] | select(.head_branch == env.HEAD_REF) | .id'); do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs" \
              --jq 'select(any(.jobs[]; .name == "Thorough review" and (.conclusion == null or .conclusion == "success"))
                and all(.jobs[]; .name != "comment" or .conclusion == null or .conclusion == "success" or .conclusion == "skipped")) | .total_count' | grep -q .; then
              found=true
              echo "::notice::Run $run reviews this commit thoroughly; skipping the automatic review."
              break
            fi
          done
          echo "found=$found" >> "$GITHUB_OUTPUT"

      # The PR head, so that the line numbers of the findings match the diff
      - uses: actions/checkout@v7
        if: steps.thorough.outputs.found != 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      # The reviewer gets no network access and no GitHub token, so everything it needs from
      # GitHub is fetched here into files
      - name: PR context
        if: steps.thorough.outputs.found != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          dir="$RUNNER_TEMP/pr"
          mkdir -p "$dir"
          gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json title,body \
            --template '{{.title}}{{"\n\n"}}{{.body}}' > "$dir/description.md"
          # The diff of exactly the checked-out commit (`gh pr diff` would give the PR's current
          # head, which differs from the checkout if someone pushed after the run started)
          gh api "repos/$GITHUB_REPOSITORY/compare/$BASE_SHA...$HEAD_SHA" \
            -H "Accept: application/vnd.github.diff" > "$dir/diff.patch"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/comments" --paginate \
            --jq '.[] | {path, line, author: .user.login, body}' > "$dir/review-comments.jsonl"

      - name: Claude Code
        id: claude
        if: steps.thorough.outputs.found != 'true'
        # v1.0.250, pinned to the commit because the action gets the Anthropic key
        uses: anthropics/claude-code-action@a26b07d8c778b0c43f64618e5fd29fd0f8af72e8
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_REVIEW_KEY }}
          # The read-only token of this job instead of the Claude GitHub App
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Du prüfst Pull Request #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            Der Stand des PRs ist im aktuellen Verzeichnis ausgecheckt. Du hast keinen Netzzugriff;
            alles von GitHub liegt in `${{ runner.temp }}/pr/`:
            - `description.md`: Titel und Beschreibung des PRs
            - `diff.patch`: der Diff des PRs gegen den Zielbranch
            - `review-comments.jsonl`: bisherige Kommentare an den Zeilen (eine Zeile JSON pro Kommentar)

            Schreibe alle Texte auf Deutsch.

            Vorgehen:
            1. Lies `.github/review-instructions.md`. Dort steht, was das Projekt ist, worauf du besonders
               achten sollst und welche Bereiche es für die Funde gibt.
            2. Lies Beschreibung und Diff. Lockfiles und minifizierte Dateien überspringst du.
            3. Halte dich an AGENTS.md, falls es sie gibt. Sie enthält die Regeln des Projekts.
            4. Was in `review-comments.jsonl` schon steht (von dir, einem anderen KI-Review oder Menschen),
               meldest du nicht noch einmal.
            5. Suche nach echten Problemen: Fehler im Verhalten, Sicherheitslücken, Datenverlust, Ausfälle
               und Verstöße gegen die Regeln des Projekts.
            6. Prüfe jeden möglichen Fund im Code nach, bevor du ihn meldest: Lies die aufgerufenen Funktionen,
               Typen und Aufrufer. Melde nur, was du belegen kannst. Keine reinen Stilfragen, keine Vermutungen.

            Gib das Ergebnis im vorgegebenen Format zurück:
            - `summary`: ein bis drei Sätze Gesamteindruck (was der PR macht und ob er so in Ordnung ist).
            - `findings`: je Fund
              - `severity`: `kritisch` (Sicherheitslücke, Datenverlust, Ausfall), `fehler` (falsches Verhalten)
                oder `hinweis` (Verstoß gegen die Regeln des Projekts, kleines Risiko; Beispiele in
                `.github/review-instructions.md`)
              - `category`: genau einer der Bereiche aus `.github/review-instructions.md`
              - `title`: ein Satz, der das Problem benennt
              - `body`: zwei bis fünf Sätze Markdown: welche Eingabe oder welcher Zustand führt zu welchem
                falschen Ergebnis, und warum. Code, Dateien und Funktionen in `Backticks`.
              - `path`, `line`: Datei und Zeile im neuen Stand. Die Zeile muss im Diff vorkommen (hinzugefügt
                oder als Kontext in einem Abschnitt). `start_line`: erste Zeile, wenn der Fund mehrere Zeilen
                umfasst, sonst null.
              - `suggestion`: ersetzter Code für genau die Zeilen `start_line` bis `line` (bzw. nur `line`), ohne
                Markdown-Zaun, nur wenn die Lösung eindeutig ist und sich auf diese Zeilen beschränkt; sonst null.
              - `agent_prompt`: Anweisung für einen KI-Agenten: in welcher Datei um welche Zeile was geändert
                werden soll und warum, so dass er es ohne den Kommentar umsetzen kann; mit dem Hinweis, vorher
                zu prüfen, ob das Problem noch besteht.
          # Only reading tools: no shell, no network, no GitHub tools. `--tools` is the list of
          # built-in tools Claude has at all. They are not in `--allowedTools`: that would allow them
          # on any path, e.g. /proc/self/environ with the key. Without it they read only the checkout
          # and the `--add-dir` directory, everything else is refused (nobody can approve in CI);
          # the deny rules hold even if that changes. The checkout is the PR's code, so its project
          # settings (hooks in .claude/settings.json) and MCP servers (.mcp.json) are not loaded:
          # they would run commands next to the key.
          claude_args: |
            --model ${{ env.MODEL }}
            --add-dir ${{ runner.temp }}/pr
            --setting-sources user
            --strict-mcp-config
            --tools "Read,Grep,Glob"
            --disallowedTools "Read(//proc/**)" "Read(//sys/**)" "Read(//etc/**)" "Read(//home/runner/.*/**)"
            --json-schema '{"type":"object","additionalProperties":false,"required":["summary","findings"],"properties":{"summary":{"type":"string"},"findings":{"type":"array","items":{"type":"object","additionalProperties":false,"required":["severity","category","title","body","path","line","start_line","suggestion","agent_prompt"],"properties":{"severity":{"type":"string","enum":["kritisch","fehler","hinweis"]},"category":{"type":"string"},"title":{"type":"string"},"body":{"type":"string"},"path":{"type":"string"},"line":{"type":"integer"},"start_line":{"type":["integer","null"]},"suggestion":{"type":["string","null"]},"agent_prompt":{"type":"string"}}}}}}'

  # Posting runs in a job of its own: it needs write access, the review job must not have it
  comment:
    needs: review
    if: needs.review.outputs.review != ''
    # An automatic and a thorough review of the same PR can finish at the same time; one after the
    # other, the second finds the summary comment of the first instead of creating another one. The
    # group is shared with the other KI review, so neither reads the line comments while the other
    # posts.
    concurrency:
      group: review-comment-${{ github.event.pull_request.number }}
      queue: max
    runs-on: ubuntu-24.04
    permissions:
      # Review comments, the summary comment on the PR and removing the label
      pull-requests: write
      # Finding a newer thorough review of the same PR that waits for this one
      actions: read
    steps:
      - name: Post review
        # v8.0.0
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          REVIEW: ${{ needs.review.outputs.review }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const MARKER = `<!-- ${process.env.LABEL}-summary -->`;
            let review;
            try {
              review = JSON.parse(process.env.REVIEW);
            } catch (error) {
              core.setFailed(`${process.env.REVIEWER} returned no valid JSON (${error.message}): ${process.env.REVIEW.slice(0, 500)}`);
              return;
            }
            const sha = process.env.HEAD_SHA;
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            const icons = { kritisch: '🔴', fehler: '🟠', hinweis: '🟡' };
            const labels = { kritisch: 'Kritisch', fehler: 'Fehler', hinweis: 'Hinweis' };
            const order = ['kritisch', 'fehler', 'hinweis'];
            // An automatic and a thorough review of the same commit can report the same finding;
            // the comment jobs run one after the other, so the second skips what the first posted.
            // Compared on the reviewed commit: after a push GitHub moves `line` of older comments,
            // `original_line` keeps the line on the commit they were posted on. Findings of earlier
            // commits the reviewer already leaves out itself (review-comments.jsonl).
            const posted = await github.paginate(github.rest.pulls.listReviewComments, { owner, repo, pull_number });
            const isPosted = (f) =>
              posted.some(
                (c) =>
                  c.original_commit_id === sha &&
                  c.path === f.path &&
                  c.original_line === f.line &&
                  c.body?.includes(`**${f.title}**`),
              );
            const findings = (review.findings ?? [])
              .filter((f) => !isPosted(f))
              .sort((a, b) => order.indexOf(a.severity) - order.indexOf(b.severity));

            // One comment per finding: severity and area, title, reasoning, suggestion, agent prompt
            const commentBody = (f) => {
              const parts = [
                `**${icons[f.severity]} ${labels[f.severity]}** · ${f.category}`,
                `**${f.title}**`,
                f.body,
              ];
              if (f.suggestion !== null && f.suggestion !== undefined) {
                parts.push('```suggestion\n' + f.suggestion.replace(/\n$/, '') + '\n```');
              }
              parts.push(
                '<details>\n<summary>🤖 Prompt für KI-Agenten</summary>\n\n```\n' +
                  f.agent_prompt +
                  '\n```\n\n</details>',
              );
              return parts.join('\n\n');
            };
            const toComment = (f) => ({
              path: f.path,
              line: f.line,
              side: 'RIGHT',
              ...(f.start_line && f.start_line < f.line ? { start_line: f.start_line, start_side: 'RIGHT' } : {}),
              body: commentBody(f),
            });

            // All findings as one GitHub review; if GitHub rejects it (e.g. a line outside the diff),
            // each finding on its own, and the ones that still fail only go into the summary
            const notPosted = [];
            if (findings.length > 0) {
              try {
                await github.rest.pulls.createReview({
                  owner, repo, pull_number, commit_id: sha, event: 'COMMENT',
                  comments: findings.map(toComment),
                });
              } catch (error) {
                core.warning(`Review with all comments failed: ${error.message}`);
                for (const f of findings) {
                  try {
                    await github.rest.pulls.createReviewComment({ owner, repo, pull_number, commit_id: sha, ...toComment(f) });
                  } catch (singleError) {
                    core.warning(`Comment on ${f.path}:${f.line} failed: ${singleError.message}`);
                    notPosted.push(f);
                  }
                }
              }
            }

            const cell = (text) => String(text).replace(/\|/g, '\\|').replace(/\n/g, ' ');
            const link = (f) => {
              const url = `${context.payload.repository.html_url}/blob/${sha}/${f.path}#L${f.line}`;
              return `[\`${cell(f.path)}:${f.line}\`](${url})`;
            };
            const counts = order
              .map((s) => [s, findings.filter((f) => f.severity === s).length])
              .filter(([, n]) => n > 0)
              .map(([s, n]) => `${icons[s]} ${n} ${labels[s]}`)
              .join(' · ');
            const lines = [MARKER, `## 🤖 ${process.env.REVIEWER}-Review${process.env.THOROUGH === 'true' ? ' (gründlich)' : ''}`, '', review.summary, ''];
            if (findings.length === 0) {
              lines.push('✅ **Keine neuen Funde.**');
            } else {
              lines.push(`**${findings.length} neue${findings.length === 1 ? 'r Fund' : ' Funde'}:** ${counts}`, '');
              lines.push('| | Fund | Bereich | Stelle |', '| :-: | --- | --- | --- |');
              for (const f of findings) {
                lines.push(`| ${icons[f.severity]} | ${cell(f.title)} | ${cell(f.category)} | ${link(f)} |`);
              }
              lines.push('', 'Details stehen in den Kommentaren an den Zeilen.');
              for (const f of notPosted) {
                lines.push('', '---', '', `Konnte nicht an die Zeile gesetzt werden (${link(f)}):`, '', commentBody(f));
              }
            }
            lines.push('', `<sub>Geprüfter Stand: ${sha.slice(0, 7)} · ${process.env.MODEL} · Gründliches Review mit ${process.env.THOROUGH_MODEL}: Label \`${process.env.LABEL}\` setzen</sub>`);
            const body = lines.join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pull_number });
            const existing = comments.find((c) => c.user?.type === 'Bot' && c.body?.startsWith(MARKER));
            // A thorough review keeps running after a push; when it finishes after the review of the
            // new head, it must not replace that summary (its line comments are posted anyway)
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number });
            const head = pr.head.sha;
            if (existing && sha !== head && existing.body.includes(`Geprüfter Stand: ${head.slice(0, 7)}`)) {
              core.notice(`The summary already shows the review of ${head.slice(0, 7)}; keeping it.`);
            } else if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pull_number, body });
            }

      # The label only starts the thorough review; removing it shows that the review is done and
      # lets the next one start by setting it again. It stays after a failed review (this job does
      # not run then), so that it is clear the thorough review is still missing. When the label was
      # set again during this review, a newer run waits for this one (concurrency) and the label
      # belongs to it.
      - name: Remove label
        if: env.THOROUGH == 'true'
        # v8.0.0
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              ...context.repo,
              workflow_id: `${process.env.LABEL}.yml`,
              branch: context.payload.pull_request.head.ref,
              event: 'pull_request',
              per_page: 100,
            });
            const newer = runs.find(
              (r) => r.id > context.runId && r.status !== 'completed' && r.display_title === 'Thorough review',
            );
            if (newer) {
              core.notice(`Run ${newer.id} reviews this PR thoroughly again; keeping the label for it.`);
              return;
            }
            try {
              await github.rest.issues.removeLabel({
                ...context.repo,
                issue_number: context.payload.pull_request.number,
                name: process.env.LABEL,
              });
            } catch (error) {
              // Someone removed it in the meantime
              if (error.status !== 404) throw error;
            }
