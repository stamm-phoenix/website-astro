name: Claude Review
# AI review of pull requests with Claude Code (Anthropic API). Setup and costs: docs/ki-review.md.
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize, labeled]
permissions:
  contents: read
  issues: write
  pull-requests: write
# A new push cancels the running automatic review of the same PR. A thorough review (label)
# gets its own group, so a push does not cancel it.
concurrency:
  group: claude-review-${{ github.event.action == 'labeled' && github.run_id || github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event.action != 'labeled' }}
jobs:
  review:
    # Only pull_request events: they run without access to secrets for PRs from forks, so code
    # from a PR (e.g. hooks in its .claude/settings.json) never runs next to the API key.
    # Fork PRs and bots (Dependabot) are skipped because they get no secrets anyway.
    # A thorough review runs when someone adds the label "claude-review" (needs write access).
    if: >-
      github.event.sender.type != 'Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action != 'labeled' || github.event.label.name == 'claude-review')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      # The PR head, so that line numbers of inline comments match the diff
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Claude Code
        id: claude
        # v1.0.250, pinned to the commit because the action gets the Anthropic key
        uses: anthropics/claude-code-action@a26b07d8c778b0c43f64618e5fd29fd0f8af72e8
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # The workflow token instead of the Claude GitHub App: comments come from github-actions
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ env.PR_NUMBER }}

            Du prüfst diesen Pull Request. Der Stand des PRs ist im aktuellen Verzeichnis ausgecheckt.
            Schreibe alle Kommentare auf Deutsch.

            Vorgehen:
            1. Lies den PR mit `gh pr view ${{ env.PR_NUMBER }}` und den Diff mit `gh pr diff ${{ env.PR_NUMBER }}`.
               Lockfiles (`bun.lock`, `package-lock.json`, `flake.lock`) und minifizierte Dateien überspringst du.
            2. Lies AGENTS.md. Sie enthält die Regeln des Projekts (Astro 7, Svelte 5 Runes, Tailwind CSS 4,
               Azure Functions in api/, Azure SQL mit Migrationen, Usability für Leitende).
            3. Lies die bisherigen Kommentare an den Zeilen mit
               `gh api repos/${{ github.repository }}/pulls/${{ env.PR_NUMBER }}/comments --paginate`.
               Was dort schon steht (von dir oder anderen), meldest du nicht noch einmal.
            4. Suche nach echten Problemen: Fehler im Verhalten, Sicherheitslücken, Datenverlust, kaputte
               Migrationen und Verstöße gegen AGENTS.md. Achte besonders auf:
               - jeder neue `/api/intern/*`-Endpunkt beginnt mit `requireStaff(request)` (bzw. `requireNikolausStaff`);
                 Pflege-Schreibendpunkte nutzen `pflegeHandler` und prüfen Eingaben in `api/lib/pflege-validation.ts`
               - Migrationen sind neue Dateien, ändern keine bestehenden und bleiben rückwärtskompatibel;
                 neue Tabellen bekommen Testdaten in `api/scripts/db-preview.ts` und ein höheres `SEEDED_KEY`
               - `content.ts` wird nur im Frontmatter von Seiten importiert, nie in Islands; Sanitizer nutzen `parseHtml`
               - Barrierefreiheit (aria-labelledby, width/height an Bildern, ARIA an interaktiven Elementen)
               - Texte im Leitendenbereich: einfache Sprache in der Du-Form, Fehlermeldungen mit nächstem Schritt
            5. Prüfe jeden möglichen Fund im Code nach, bevor du ihn meldest: Lies die aufgerufenen Funktionen,
               Typen und Aufrufer. Melde nur, was du belegen kannst. Keine reinen Stilfragen, keine Vermutungen.
            6. Melde jeden Fund als Kommentar an der betroffenen Zeile (bei mehreren Zeilen mit `startLine`) mit
               `mcp__github_inline_comment__create_inline_comment`. Halte dich genau an diese Form:

               **🔴 Kritisch** · Sicherheit

               **Ein Satz, der das Problem benennt.**

               Zwei bis fünf Sätze: welche Eingabe oder welcher Zustand führt zu welchem falschen Ergebnis,
               und warum. Code, Dateien und Funktionen in `Backticks`.

               ```suggestion
               ersetzter Code für genau die kommentierten Zeilen
               ```

               <details>
               <summary>🤖 Prompt für KI-Agenten</summary>

               ```
               In `pfad/zur/datei.ts` um Zeile N: was geändert werden soll und warum, so dass ein
               Agent es ohne den Kommentar umsetzen kann. Vorher prüfen, ob das Problem noch besteht.
               ```

               </details>

               Schwere (genau eine): **🔴 Kritisch** (Sicherheitslücke, Datenverlust, Ausfall),
               **🟠 Fehler** (falsches Verhalten), **🟡 Hinweis** (Verstoß gegen AGENTS.md, Barrierefreiheit,
               Wortwahl, kleines Risiko). Bereich (genau einer): Sicherheit, Funktion, Daten, Barrierefreiheit,
               Usability, Projektregeln, Performance.
               Den ```suggestion-Block nur, wenn die Lösung eindeutig ist und sich auf die kommentierten Zeilen
               beschränkt; er ersetzt diese Zeilen vollständig. Sonst weglassen.
            7. Gib zum Schluss das strukturierte Ergebnis zurück: `summary` mit ein bis drei Sätzen Gesamteindruck
               (was der PR macht und ob er so in Ordnung ist) und `findings` mit genau den Funden, die du in
               diesem Lauf als Kommentar gepostet hast. Poste keinen weiteren Kommentar, die Zusammenfassung
               erstellt der Workflow daraus.
          claude_args: |
            --model ${{ github.event.action == 'labeled' && 'claude-opus-5-5' || 'claude-sonnet-5-5' }}
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ env.PR_NUMBER }}/comments:*)"
            --json-schema '{"type":"object","properties":{"summary":{"type":"string"},"findings":{"type":"array","items":{"type":"object","properties":{"severity":{"type":"string","enum":["kritisch","fehler","hinweis"]},"category":{"type":"string"},"title":{"type":"string"},"path":{"type":"string"},"line":{"type":"integer"}},"required":["severity","category","title","path","line"]}}},"required":["summary","findings"]}'

      # One summary comment per PR, updated by every run (found by the marker in the first line)
      - name: Summary comment
        if: steps.claude.outputs.structured_output != ''
        # v8.0.0
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          REVIEW: ${{ steps.claude.outputs.structured_output }}
          THOROUGH: ${{ github.event.action == 'labeled' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const MARKER = '<!-- claude-review-summary -->';
            const review = JSON.parse(process.env.REVIEW);
            const sha = process.env.HEAD_SHA;
            const icons = { kritisch: '🔴', fehler: '🟠', hinweis: '🟡' };
            const labels = { kritisch: 'Kritisch', fehler: 'Fehler', hinweis: 'Hinweis' };
            const order = ['kritisch', 'fehler', 'hinweis'];
            const findings = [...(review.findings ?? [])].sort(
              (a, b) => order.indexOf(a.severity) - order.indexOf(b.severity),
            );
            const cell = (text) => String(text).replace(/\|/g, '\\|').replace(/\n/g, ' ');
            const link = (f) => {
              const url = `${context.payload.repository.html_url}/blob/${sha}/${f.path}#L${f.line}`;
              return `[\`${cell(f.path)}:${f.line}\`](${url})`;
            };

            const counts = order
              .map((s) => [s, findings.filter((f) => f.severity === s).length])
              .filter(([, n]) => n > 0)
              .map(([s, n]) => `${icons[s]} ${n} ${labels[s]}`)
              .join(' · ');
            const lines = [
              MARKER,
              `## 🤖 Claude-Review${process.env.THOROUGH === 'true' ? ' (gründlich)' : ''}`,
              '',
              review.summary,
              '',
            ];
            if (findings.length === 0) {
              lines.push('✅ **Keine neuen Funde.**');
            } else {
              lines.push(`**${findings.length} neue${findings.length === 1 ? 'r Fund' : ' Funde'}:** ${counts}`, '');
              lines.push('| | Fund | Bereich | Stelle |', '| :-: | --- | --- | --- |');
              for (const f of findings) {
                lines.push(`| ${icons[f.severity]} | ${cell(f.title)} | ${cell(f.category)} | ${link(f)} |`);
              }
              lines.push('', 'Details stehen in den Kommentaren an den Zeilen.');
            }
            lines.push(
              '',
              `<sub>Geprüfter Stand: ${sha.slice(0, 7)} · ${process.env.THOROUGH === 'true' ? 'Opus' : 'Sonnet'}` +
                ' · Gründliches Review mit Opus: Label `claude-review` setzen</sub>',
            );
            const body = lines.join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.user?.type === 'Bot' && c.body?.startsWith(MARKER));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
