name: Azure Static Web Apps CI/CD
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
  # Content refresh (jobs content-*): rebuilds the site with the current content of the API,
  # without code changes. The public pages contain content baked at build time (see
  # web/src/lib/content/). Triggered by the Pflege forms (repository_dispatch from
  # api/lib/site-rebuild.ts), by hand, and by an hourly check that only builds when the content
  # differs from the deployed version. The check runs from about 6 to 23 o'clock German time
  # (cron is in UTC); at night it never found anything. It lives in this file because the Static
  # Web App accepts OIDC deploys only from the workflow file named after it.
  schedule:
    - cron: "17 4-21 * * *"
  repository_dispatch:
    types: [content-changed]
  workflow_dispatch:
# No concurrency for the whole run, so a run never waits for the build and tests of another.
# Build and test jobs have a group per PR (by number: github.ref of a "closed" event is the base
# branch) or pushed branch, and a newer push cancels them; a series of merges builds only the
# newest commit, which contains the others. Other events get a group per run. Every job that
# deploys or removes a deployment is never cancelled, because an Azure upload may continue
# remotely after cancellation; its queue keeps the order in which the builds finished. Two
# queues, so a preview never waits for another preview or for production (#566): production
# (Deploy, Deploy content) shares the group website-astro-production, and everything that
# touches the preview of one PR (database, Deploy preview, Close Pull Request, and the reset in
# preview-db-reset.yml) shares website-astro-preview-pr-<number>. The number, not github.ref:
# the ref of a "closed" event is the base branch. A cancelled build or test skips its deploy.
permissions:
  contents: read
jobs:
  # Which build and test jobs this run needs (web/scripts/ci/job-plan.ts). Pull requests skip
  # what their diff cannot affect; every other event, a CI change and any error run everything.
  plan:
    if: (github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]')) || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    name: Plan
    outputs:
      web: ${{ steps.plan.outputs.web }}
      api_tests: ${{ steps.plan.outputs.api_tests }}
      api_package: ${{ steps.plan.outputs.api_package }}
      browser: ${{ steps.plan.outputs.browser }}
      preview: ${{ steps.plan.outputs.preview }}
    steps:
      # Two commits on pull requests: the first parent of the merge commit is the base
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Plan the jobs
        id: plan
        working-directory: web
        # The script needs no dependencies and falls back to everything itself; a crash does too
        env:
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
        run: |
          if ! bun scripts/ci/plan-jobs.ts "$GITHUB_EVENT_NAME" "$BASE" > "$RUNNER_TEMP/plan"; then
            echo "::warning::Planning failed, running everything."
            printf 'web=true\napi_tests=true\napi_package=true\nbrowser=true\npreview=true\n' > "$RUNNER_TEMP/plan"
          fi
          tee -a "$GITHUB_OUTPUT" < "$RUNNER_TEMP/plan"
  build-web:
    needs: plan
    if: needs.plan.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    name: Build website
    concurrency:
      group: ci-build-web-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && github.ref || github.run_id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          check-latest: true
      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            web/node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - name: Install dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Build
        working-directory: web
        run: bun run build
        env:
          BUILD_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          # main bakes the live content; PR previews only test data, so they keep no copies
          # of real photos (see web/src/lib/content/source.ts)
          CONTENT_SOURCE: ${{ github.event_name == 'push' && 'live' || 'mock' }}
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: web/dist
          retention-days: 1
  check-web:
    needs: plan
    if: needs.plan.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    name: Check website
    concurrency:
      group: ci-check-web-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && github.ref || github.run_id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          check-latest: true
      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            web/node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      # ESLint lints only files whose content changed since the cached run. Its rules use no
      # type information, so the result of an unchanged file cannot depend on other files.
      # The cache resets with the dependencies or the configuration.
      # Pull requests only read the cache; only pushes to main save it, so a PR run adds no entry.
      - name: Restore ESLint results
        uses: actions/cache/restore@v6
        with:
          path: web/.eslintcache
          key: eslint-${{ runner.os }}-${{ hashFiles('web/bun.lock', 'web/eslint.config.mjs') }}-${{ github.sha }}
          restore-keys: |
            eslint-${{ runner.os }}-${{ hashFiles('web/bun.lock', 'web/eslint.config.mjs') }}-
      - name: Install dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Check frontend (ESLint, Astro, Svelte and unit tests in parallel)
        working-directory: web
        run: bun run check
      - name: Save ESLint results
        if: github.event_name == 'push'
        uses: actions/cache/save@v6
        with:
          path: web/.eslintcache
          key: eslint-${{ runner.os }}-${{ hashFiles('web/bun.lock', 'web/eslint.config.mjs') }}-${{ github.sha }}
  # Two calls, so the PR preview can wait for the API package (api-static) without waiting
  # for the API tests. Both are named "api" to keep the check names "api / Check API tests"
  # and "api / Check API static"; the gate job Build requires both.
  api:
    needs: plan
    if: needs.plan.outputs.api_tests == 'true'
    name: api
    uses: ./.github/workflows/check-api.yml
  # Runs whenever a preview needs the package; without API changes it may take the package
  # built on main for the same inputs from the cache and skip the build and checks.
  api-static:
    needs: plan
    if: needs.plan.outputs.api_package == 'true' || needs.plan.outputs.preview == 'true'
    name: api
    uses: ./.github/workflows/check-api-static.yml
    with:
      use-cache: ${{ needs.plan.outputs.api_package != 'true' }}
  build:
    # One stable check name for branch protection over the website and API jobs. Always runs
    # and fails on anything but success. Cancelled jobs pass only when the run was replaced by a
    # newer state; a timeout-minutes hit cancels a job too and must not pass as skipped.
    if: always() && ((github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]')) || (github.event_name == 'pull_request' && github.event.action != 'closed'))
    needs: [plan, build-web, check-web, api, api-static]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    name: Build
    outputs:
      superseded: ${{ steps.gate.outputs.superseded }}
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - name: Website and API passed
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          # job:result:planned; planned is false for a job the plan deselected
          RESULTS: >-
            plan:${{ needs.plan.result }}:true
            build-web:${{ needs.build-web.result }}:${{ needs.plan.outputs.web }}
            check-web:${{ needs.check-web.result }}:${{ needs.plan.outputs.web }}
            api:${{ needs.api.result }}:${{ needs.plan.outputs.api_tests }}
            api-static:${{ needs.api-static.result }}:${{ needs.plan.outputs.api_package == 'true' || needs.plan.outputs.preview == 'true' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          failed=
          cancelled=
          plan_ok=
          case "$RESULTS" in plan:success:*) plan_ok=1 ;; esac
          for entry in $RESULTS; do
            IFS=: read -r _ result planned <<< "$entry"
            case "$result" in
              success) ;;
              cancelled) cancelled=1 ;;
              # Deselected by the plan counts as passed. Without a successful plan every job is
              # skipped, and the plan's own result decides.
              skipped) if [ "$planned" != false ] && [ -n "$plan_ok" ]; then failed=1; fi ;;
              *) failed=1 ;;
            esac
          done
          if [ -n "$failed" ]; then
            echo "::error::A required job did not succeed: $RESULTS"
            exit 1
          fi
          if [ -z "$cancelled" ]; then
            exit 0
          fi
          # Only cancelled jobs are left. That is harmless only for a run that a newer state replaced;
          # a job that hit its timeout-minutes is cancelled too and must fail the check. A failed
          # request fails the step (set -e), so an unreadable state counts as not superseded.
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '"\(.state) \(.head.sha)"')"
            read -r state head <<< "$pr"
            if [ "$state" != open ]; then
              reason="the pull request is $state"
            elif [ "$head" != "$HEAD_SHA" ]; then
              reason="the pull request moved on to $head"
            fi
          else
            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/azure-static-web-apps-zealous-water-04f606303.yml/runs?branch=main&event=push&per_page=30" \
              --jq ".workflow_runs[] | select(.run_number > $RUN_NUMBER) | .id")"
            if [ -n "$runs" ]; then
              reason="a newer push run exists"
            fi
          fi
          if [ -n "${reason:-}" ]; then
            echo "::notice::Cancelled jobs ignored, this run was replaced: $reason."
            echo "superseded=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::A required job was cancelled and this run was not replaced (timeout or manual cancel): $RESULTS"
          exit 1
  browser-tests:
    needs: plan
    if: needs.plan.outputs.browser == 'true'
    uses: ./.github/workflows/browser-tests.yml
  browser-tests-result:
    # One stable check name for branch protection, independent of the number of shards. Always
    # runs and fails on anything but success; cancelled shards pass only for a replaced run.
    if: always() && ((github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]')) || (github.event_name == 'pull_request' && github.event.action != 'closed'))
    needs: [plan, browser-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    name: Browser tests
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - name: All shards passed
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          # job:result:planned; planned is false for a job the plan deselected
          RESULTS: >-
            plan:${{ needs.plan.result }}:true
            browser-tests:${{ needs.browser-tests.result }}:${{ needs.plan.outputs.browser }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          failed=
          cancelled=
          plan_ok=
          case "$RESULTS" in plan:success:*) plan_ok=1 ;; esac
          for entry in $RESULTS; do
            IFS=: read -r _ result planned <<< "$entry"
            case "$result" in
              success) ;;
              cancelled) cancelled=1 ;;
              # Deselected by the plan counts as passed. Without a successful plan every job is
              # skipped, and the plan's own result decides.
              skipped) if [ "$planned" != false ] && [ -n "$plan_ok" ]; then failed=1; fi ;;
              *) failed=1 ;;
            esac
          done
          if [ -n "$failed" ]; then
            echo "::error::A required job did not succeed: $RESULTS"
            exit 1
          fi
          if [ -z "$cancelled" ]; then
            exit 0
          fi
          # Only cancelled jobs are left. That is harmless only for a run that a newer state replaced;
          # a job that hit its timeout-minutes is cancelled too and must fail the check. A failed
          # request fails the step (set -e), so an unreadable state counts as not superseded.
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '"\(.state) \(.head.sha)"')"
            read -r state head <<< "$pr"
            if [ "$state" != open ]; then
              reason="the pull request is $state"
            elif [ "$head" != "$HEAD_SHA" ]; then
              reason="the pull request moved on to $head"
            fi
          else
            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/azure-static-web-apps-zealous-water-04f606303.yml/runs?branch=main&event=push&per_page=30" \
              --jq ".workflow_runs[] | select(.run_number > $RUN_NUMBER) | .id")"
            if [ -n "$runs" ]; then
              reason="a newer push run exists"
            fi
          fi
          if [ -n "${reason:-}" ]; then
            echo "::notice::Cancelled jobs ignored, this run was replaced: $reason."
            echo "superseded=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::A required job was cancelled and this run was not replaced (timeout or manual cancel): $RESULTS"
          exit 1
  prepare-preview:
    # Prepares the isolated PR database while the website and API build; Deploy preview needs it.
    # Skipped with the plan (documentation only), which skips Deploy preview too.
    needs: plan
    if: needs.plan.outputs.preview == 'true' && github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.type != 'Bot'
    uses: ./.github/workflows/prepare-preview.yml
    permissions:
      id-token: write
      contents: read
      pull-requests: read

  deploy-preview:
    # The PR preview waits only for the website build, the API package and its database, not
    # for the tests (#565): agents and reviewers need it early, and the checks on the PR still
    # show a red test. Build and Browser tests never depend on it.
    # PRs from forks get neither secrets nor OIDC tokens and PRs opened by bots (Dependabot) get
    # no preview; prepare-preview is skipped for both, which skips this job. Close Pull Request
    # still runs for them and removes any leftovers.
    needs: [build-web, api-static, prepare-preview]
    if: github.event_name == 'pull_request' && needs.prepare-preview.outputs.prepared == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Not "Deploy": the push runs look up their newest deploy by that job name.
    name: Deploy preview
    # The queue of this PR: behind its database, its earlier deploys, its cleanup and its reset,
    # but not behind other PRs or production
    concurrency:
      group: website-astro-preview-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
      queue: max
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      actions: read
    steps:
      # Runs no longer wait for each other, so a run can reach this group after a newer one. The
      # PR must still be open (Close Pull Request shares the group of this PR; a deploy after it
      # would bring back the preview and its database) and still point at this commit. Fails
      # closed.
      - name: Skip if the PR moved on or was closed
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # A separate assignment, so a failed request fails the step (read would hide it)
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '"\(.state) \(.head.sha)"')"
          read -r state head <<< "$pr"
          if [ "$state" != open ]; then
            reason="the pull request is $state"
          elif [ "$head" != "$HEAD_SHA" ]; then
            reason="the pull request moved on to $head"
          fi
          if [ -n "${reason:-}" ]; then
            echo "::notice::Not deploying: $reason."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.current.outputs.deploy == 'true'
      - name: Download build artifact
        if: steps.current.outputs.deploy == 'true'
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      # Each PR preview gets a database of its own with test data (website-pr-<number>); without
      # SQL_PREVIEW_CLIENT_ID the preview is not deployed rather than falling back to the
      # production data (docs/azure-sql.md).
      - name: Setup Bun (database)
        if: steps.current.outputs.deploy == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install API dependencies (database)
        if: steps.current.outputs.deploy == 'true'
        working-directory: api
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Download preview database configuration
        if: steps.current.outputs.deploy == 'true'
        uses: actions/download-artifact@v8
        with:
          name: preview-deployment
          path: api/lib
      # A playwright-api PR named in the description (playwright-api#12) lends its preview to
      # this one, so both can be tried together; otherwise, or while its preview does not
      # answer, the preview uses the production Playwright API. Never fails the deploy.
      - name: Link playwright-api preview
        if: steps.current.outputs.deploy == 'true'
        working-directory: api
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/playwright-preview.ts "${{ github.event.pull_request.number }}"
      - name: Upload to Azure Static Web Apps
        if: steps.current.outputs.deploy == 'true'
        id: upload
        uses: ./.github/actions/swa-upload
        with:
          pr-number: ${{ github.event.pull_request.number }}
          api-token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ZEALOUS_WATER_04F606303 }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # Previews get their login callback registered in Entra, see docs/entra-preview-login.md.
      # Skipped until the repository variables are set.
      - name: Azure login (Entra)
        if: steps.current.outputs.deploy == 'true' && vars.ENTRA_DEPLOY_CLIENT_ID != ''
        uses: azure/login@v3
        with:
          client-id: ${{ vars.ENTRA_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.ENTRA_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Register preview login callback
        if: steps.current.outputs.deploy == 'true' && vars.ENTRA_DEPLOY_CLIENT_ID != ''
        env:
          ENTRA_WEBSITE_APP_OBJECT_ID: ${{ vars.ENTRA_WEBSITE_APP_OBJECT_ID }}
          PREVIEW_URL: ${{ steps.upload.outputs.static-web-app-url }}
          FALLBACK_HOST: zealous-water-04f606303-${{ github.event.pull_request.number }}.westeurope.1.azurestaticapps.net
        run: |
          host="${PREVIEW_URL#https://}"
          host="${host%%/*}"
          .github/scripts/entra-preview-redirect.sh add "${host:-$FALLBACK_HOST}"

  deploy:
    # Production: a push to main deploys only after Build and all Browser tests passed.
    needs: [build, browser-tests]
    if: >-
      always() && !cancelled() && github.event_name == 'push' &&
      needs.build.result == 'success' && needs.build.outputs.superseded != 'true' &&
      needs.browser-tests.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    name: Deploy
    # Shared only with Deploy content, never with a preview
    concurrency:
      group: website-astro-production
      cancel-in-progress: false
      queue: max
    outputs:
      deployed: ${{ steps.current.outputs.deploy }}
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      # The runs and jobs of newer pushes, read before deploying
      actions: read
    steps:
      # Runs no longer wait for each other, so a run can reach this group after a newer one
      # (its Build job got a runner later). Its deploy would roll the site back, so it deploys
      # only while no newer push run has deployed yet. Fails closed.
      - name: Skip if a newer state was deployed
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/azure-static-web-apps-zealous-water-04f606303.yml/runs?branch=main&event=push&per_page=30" \
            --jq ".workflow_runs[] | select(.run_number > $RUN_NUMBER) | .id")"
          for run in $runs; do
            deploy="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs" --jq '[.jobs[] | select(.name == "Deploy")][0].conclusion // ""')"
            if [ "$deploy" = success ]; then
              reason="the newer run $run deployed already"
              break
            fi
          done
          if [ -n "${reason:-}" ]; then
            echo "::notice::Not deploying: $reason."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.current.outputs.deploy == 'true'
      - name: Download build artifact
        if: steps.current.outputs.deploy == 'true'
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      # Schema changes reach the database before the code that needs them (docs/azure-sql.md).
      # main migrates the production database; a missing SQL_MIGRATION_CLIENT_ID fails the
      # deploy instead of shipping code without its schema.
      - name: Setup Bun (database)
        if: steps.current.outputs.deploy == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install API dependencies (database)
        if: steps.current.outputs.deploy == 'true'
        working-directory: api
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Azure login (database migrations)
        if: steps.current.outputs.deploy == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.SQL_MIGRATION_CLIENT_ID }}
          tenant-id: ${{ vars.ENTRA_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Apply database migrations
        if: steps.current.outputs.deploy == 'true'
        working-directory: api
        run: bun scripts/db-migrate.ts
      - name: Verify protocol cutover gate or current SQL import
        if: steps.current.outputs.deploy == 'true'
        working-directory: api
        run: bun scripts/protokoll-migrate.ts --check
      - name: Upload to Azure Static Web Apps
        if: steps.current.outputs.deploy == 'true'
        uses: ./.github/actions/swa-upload
        with:
          api-token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ZEALOUS_WATER_04F606303 }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    name: Close Pull Request
    # The queue of this PR, so the cleanup comes after a running deploy or database step of it
    concurrency:
      group: website-astro-preview-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
      queue: max
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - name: Get Id Token
        uses: actions/github-script@v9
        id: idtoken
        with:
          script: |
            return await core.getIDToken()
          result-encoding: string
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ZEALOUS_WATER_04F606303 }}
          action: "close"
          github_id_token: ${{ steps.idtoken.outputs.result }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
      # The base branch, not the PR: the merge ref of a PR closed with conflicts may not exist,
      # and the cleanup should run code that was reviewed
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install API dependencies (database)
        working-directory: api
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Azure login (preview database)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.SQL_PREVIEW_CLIENT_ID }}
          tenant-id: ${{ vars.ENTRA_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Drop preview database
        working-directory: api
        run: bun scripts/db-preview.ts drop "${{ github.event.pull_request.number }}"
      - name: Azure login (Entra)
        if: vars.ENTRA_DEPLOY_CLIENT_ID != ''
        uses: azure/login@v3
        with:
          client-id: ${{ vars.ENTRA_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.ENTRA_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Remove preview login callback
        if: vars.ENTRA_DEPLOY_CLIENT_ID != ''
        env:
          ENTRA_WEBSITE_APP_OBJECT_ID: ${{ vars.ENTRA_WEBSITE_APP_OBJECT_ID }}
        run: .github/scripts/entra-preview-redirect.sh remove "${{ github.event.pull_request.number }}"

  deploy-task-worker:
    # Explicit status check: prepare-preview is a skipped ancestor on main.
    # Only after a successful website deployment that was not skipped as outdated.
    if: >-
      !cancelled() && needs.deploy.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.TASK_REMINDER_FUNCTION_APP != '' && needs.deploy.outputs.deployed == 'true'
    needs: [deploy]
    name: Deploy Azure task timer
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Runs no longer wait for each other, so the timer deploys of two merges could overlap or
    # arrive out of order (a job may get its runner later); the queue serializes them and the
    # first step skips a timer deploy once a newer state is out.
    concurrency:
      group: task-reminder-deployment
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      id-token: write
      # The runs and jobs of newer pushes, read before deploying
      actions: read
    steps:
      # A newer push run that deployed its website brings its own timer (or already did), so
      # this older one would roll the timer back. Fails closed like the check of Deploy.
      - name: Skip if a newer state was deployed
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/azure-static-web-apps-zealous-water-04f606303.yml/runs?branch=main&event=push&per_page=30" \
            --jq ".workflow_runs[] | select(.run_number > $RUN_NUMBER) | .id")"
          for run in $runs; do
            deployed="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs" \
              --jq '[.jobs[] | select((.name == "Deploy" or .name == "Deploy Azure task timer") and .conclusion == "success")] | length')"
            if [ "$deployed" != 0 ]; then
              echo "::notice::Not deploying: the newer run $run deployed already."
              echo "deploy=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "deploy=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.current.outputs.deploy == 'true'
      - uses: oven-sh/setup-bun@v2
        if: steps.current.outputs.deploy == 'true'
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v7
        if: steps.current.outputs.deploy == 'true'
        with:
          node-version: "22"
          check-latest: true
      - name: Build standalone timer package
        if: steps.current.outputs.deploy == 'true'
        run: bash scripts/package-task-worker.sh /tmp/task-reminder-worker
      - name: Azure login (timer deployment only)
        if: steps.current.outputs.deploy == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.TASK_REMINDER_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.ENTRA_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy timer code
        if: steps.current.outputs.deploy == 'true'
        env:
          FUNCTION_APP: ${{ vars.TASK_REMINDER_FUNCTION_APP }}
        run: az functionapp deployment source config-zip --resource-group website-astro --name "$FUNCTION_APP" --src /tmp/task-reminder-worker.zip --build-remote false --output none

  content-check:
    if: (github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    name: Check for new content
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      build: ${{ steps.check.outputs.build }}
      commit: ${{ steps.check.outputs.commit }}
      required: ${{ steps.check.outputs.required }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Compare live content with the deployed version
        id: check
        working-directory: web
        # Changes from the Pflege forms and manual runs always build
        run: bun scripts/content-check.ts ${{ github.event_name != 'schedule' && '--force' || '' }}

  main-deployed:
    # Only a signal, apart from the content jobs: a failure here does not skip them
    if: github.event_name == 'schedule' && github.ref == 'refs/heads/main'
    needs: content-check
    runs-on: ubuntu-24.04
    name: Check that main is deployed
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Compare the deployed commit with main
        working-directory: web
        env:
          DEPLOYED_COMMIT: ${{ needs.content-check.outputs.commit }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bun scripts/main-deployed-check.ts

  content-build:
    needs: content-check
    if: needs.content-check.outputs.build == 'true'
    runs-on: ubuntu-24.04
    name: Build with current content
    timeout-minutes: 20
    permissions:
      contents: read
    # A newer change replaces a build that has not finished yet; started deploys are not affected
    concurrency:
      group: content-refresh-build
      cancel-in-progress: true
    outputs:
      commit: ${{ steps.switch.outputs.commit }}
    steps:
      - name: Wait for further changes
        # Someone editing several entries in a row causes one build instead of many
        if: github.event_name == 'repository_dispatch'
        run: sleep 90
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Switch to the deployed commit
        id: switch
        env:
          DEPLOYED_COMMIT: ${{ needs.content-check.outputs.commit }}
        # The commit is read from the live site, so only commits on main are accepted.
        # It always rebuilds the deployed commit, so code reaches the site only through a
        # push to main with its tests.
        run: |
          if [ -n "$DEPLOYED_COMMIT" ] && git merge-base --is-ancestor "$DEPLOYED_COMMIT" HEAD 2>/dev/null; then
            git checkout --quiet --detach "$DEPLOYED_COMMIT"
          else
            echo "::warning::Deployed commit '$DEPLOYED_COMMIT' is not on main; building main instead"
          fi
          commit="$(git rev-parse HEAD)"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "BUILD_COMMIT_SHA=$commit" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          check-latest: true
      # No dependency cache: this job runs in the context of the default branch
      - name: Install dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      # Same commit as the last deploy of main, which passed lint and tests; only the content differs
      - name: Build
        working-directory: web
        run: bun run build
        env:
          CONTENT_SOURCE: live
          # Never remove content the deployed site has; a source that is down and missing there
          # as well does not block the other content
          CONTENT_STRICT: ${{ needs.content-check.outputs.required }}
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: content-dist
          path: web/dist
          retention-days: 1

  content-deploy:
    needs: content-build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    name: Deploy content
    concurrency:
      group: website-astro-production
      cancel-in-progress: false
      queue: max
    permissions:
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Skip if the code was deployed in the meantime
        id: current
        env:
          BUILT_COMMIT: ${{ needs.content-build.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
        # A newer deploy of main already contains the current content; ours would roll it back.
        # The deployed commit is the one of the newest push run whose Deploy job succeeded; that
        # job shares this concurrency group (website-astro-production). stamm-phoenix.de is not
        # asked, because Cloudflare answers requests from runners with a bot check at random.
        # Fails closed: if the deployed commit cannot be read, nothing is deployed.
        run: |
          deployed=""
          if runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/azure-static-web-apps-zealous-water-04f606303.yml/runs?branch=main&event=push&per_page=100" --jq '.workflow_runs[] | select(.status == "completed") | "\(.id) \(.head_sha)"')"; then
            while read -r run sha; do
              [ -n "$run" ] || continue
              deploy="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs" --jq '[.jobs[] | select(.name == "Deploy")][0].conclusion // ""')" || break
              if [ "$deploy" = "success" ]; then deployed="$sha"; break; fi
            done <<< "$runs"
          fi
          if [ -z "$deployed" ]; then
            echo "::warning::Could not read the deployed commit; not deploying."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          elif [ "$deployed" != "$BUILT_COMMIT" ]; then
            echo "::warning::Deployed commit changed from $BUILT_COMMIT to $deployed; not deploying."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.current.outputs.deploy == 'true'
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Use the API of the built commit
        if: steps.current.outputs.deploy == 'true'
        env:
          BUILT_COMMIT: ${{ needs.content-build.outputs.commit }}
        # The build job only builds commits on main; checked again before the API is deployed
        run: |
          git merge-base --is-ancestor "$BUILT_COMMIT" HEAD
          git checkout --quiet --detach "$BUILT_COMMIT"
      - name: Download build artifact
        if: steps.current.outputs.deploy == 'true'
        uses: actions/download-artifact@v8
        with:
          name: content-dist
          path: dist
      # An older deployed commit may predate prebuilt API packages; keep its old build path.
      - uses: oven-sh/setup-bun@v2
        if: steps.current.outputs.deploy == 'true' && hashFiles('scripts/package-content-api.sh') != ''
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v7
        if: steps.current.outputs.deploy == 'true' && hashFiles('scripts/package-content-api.sh') != ''
        with:
          node-version: "22"
      - name: Prepare tested production API
        id: package
        if: steps.current.outputs.deploy == 'true' && hashFiles('scripts/package-content-api.sh') != ''
        run: |
          bash scripts/package-content-api.sh
          echo "prebuilt=true" >> "$GITHUB_OUTPUT"
      - name: Get Id Token
        if: steps.current.outputs.deploy == 'true'
        uses: actions/github-script@v9
        id: idtoken
        with:
          script: |
            return await core.getIDToken()
          result-encoding: string
      - name: Deploy to Azure Static Web Apps
        if: steps.current.outputs.deploy == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ZEALOUS_WATER_04F606303 }}
          action: "upload"
          app_location: "dist"
          api_location: ${{ steps.package.outputs.prebuilt == 'true' && 'content-swa-api' || 'api' }}
          skip_api_build: ${{ steps.package.outputs.prebuilt == 'true' }}
          output_location: ""
          skip_app_build: true
          github_id_token: ${{ steps.idtoken.outputs.result }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
