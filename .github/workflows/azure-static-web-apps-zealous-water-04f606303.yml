name: Azure Static Web Apps CI/CD
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
concurrency:
  # PR runs are grouped per PR number: once a PR is merged, github.ref of its "closed"
  # event is the base branch, which used to put the cleanup and the main deploy in one
  # group and let them cancel each other.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  # Only superseded PR builds are cancelled; main deploys and PR cleanup always finish
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' }}
permissions:
  contents: read
  pull-requests: write
jobs:
  build:
    if: (github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]')) || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-24.04
    name: Build
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            web/node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - name: Install dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Check frontend (ESLint, Astro and Svelte)
        working-directory: web
        run: bun run check
      - name: Build
        working-directory: web
        run: bun run build
        env:
          BUILD_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install API test dependencies
        working-directory: api
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Test API
        working-directory: api
        run: bun run test
      - name: Lint API
        working-directory: api
        run: bun run lint
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: web/dist
          retention-days: 1
  browser-tests:
    if: (github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]')) || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-24.04
    name: Browser tests
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Install Chromium
        working-directory: web
        run: bunx playwright install --with-deps chromium
      - name: Test browser workflows with simulated data
        working-directory: web
        run: bun run test:e2e
      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
  deploy:
    needs: [build, browser-tests]
    runs-on: ubuntu-24.04
    name: Deploy
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Get Id Token
        uses: actions/github-script@v7
        id: idtoken
        with:
          script: |
            return await core.getIDToken()
          result-encoding: string
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ZEALOUS_WATER_04F606303 }}
          action: 'upload'
          app_location: 'dist'
          api_location: 'api'
          output_location: ''
          skip_app_build: true
          github_id_token: ${{ steps.idtoken.outputs.result }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-24.04
    name: Close Pull Request
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - name: Get Id Token
        uses: actions/github-script@v7
        id: idtoken
        with:
          script: |
            return await core.getIDToken()
          result-encoding: string
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ZEALOUS_WATER_04F606303 }}
          action: 'close'
          github_id_token: ${{ steps.idtoken.outputs.result }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
