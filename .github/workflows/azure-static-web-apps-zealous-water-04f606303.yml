name: Azure Static Web Apps CI/CD
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
  # Content refresh (jobs content-*): rebuilds the site with the current content of the API,
  # without code changes. The public pages contain content baked at build time (see
  # web/src/lib/content/). Triggered by the Pflege forms (repository_dispatch from
  # api/lib/site-rebuild.ts), by hand, and by an hourly check that only builds when the content
  # differs from the deployed version. The check runs from about 6 to 23 o'clock German time
  # (cron is in UTC); at night it never found anything. It lives in this file because the Static
  # Web App accepts OIDC deploys only from the workflow file named after it.
  schedule:
    - cron: "17 4-21 * * *"
  repository_dispatch:
    types: [content-changed]
  workflow_dispatch:
# No concurrency for the whole run, so a run never waits for the build and tests of another.
# Build and test jobs have a group per PR (by number: github.ref of a "closed" event is the base
# branch) or pushed branch, and a newer push cancels them; a series of merges builds only the
# newest commit, which contains the others. Other events get a group per run. Every job that
# deploys or removes a deployment shares the group website-astro-deployment and is never
# cancelled, because an Azure upload may continue remotely after cancellation; its queue keeps
# the order in which the builds finished. A cancelled build or test skips its deploy.
permissions:
  contents: read
  pull-requests: write
jobs:
  build-web:
    if: (github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]')) || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-24.04
    name: Build website
    concurrency:
      group: ci-build-web-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && github.ref || github.run_id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            web/node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - name: Install dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Build
        working-directory: web
        run: bun run build
        env:
          BUILD_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          # main bakes the live content; PR previews only test data, so they keep no copies
          # of real photos (see web/src/lib/content/source.ts)
          CONTENT_SOURCE: ${{ github.event_name == 'push' && 'live' || 'mock' }}
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: web/dist
          retention-days: 1
  check-web:
    if: (github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]')) || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-24.04
    name: Check website
    concurrency:
      group: ci-check-web-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && github.ref || github.run_id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            web/node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      # ESLint lints only files whose content changed since the cached run. Its rules use no
      # type information, so the result of an unchanged file cannot depend on other files.
      # The cache resets with the dependencies or the configuration.
      - name: Cache ESLint results
        uses: actions/cache@v4
        with:
          path: web/.eslintcache
          key: eslint-${{ runner.os }}-${{ hashFiles('web/bun.lock', 'web/eslint.config.mjs') }}-${{ github.sha }}
          restore-keys: |
            eslint-${{ runner.os }}-${{ hashFiles('web/bun.lock', 'web/eslint.config.mjs') }}-
      - name: Install dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Check frontend (ESLint, Astro, Svelte and unit tests in parallel)
        working-directory: web
        run: bun run check
  api:
    if: (github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]')) || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-24.04
    name: Check API
    concurrency:
      group: ci-api-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && github.ref || github.run_id }}
      cancel-in-progress: true
    # The API tests of the Nikolaus data run against a real SQL Server (api/test/fixtures/database.ts)
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Test_Passw0rd!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Test_Passw0rd!' -Q 'SELECT 1' -b"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install API test dependencies
        working-directory: api
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Test API
        working-directory: api
        # Builds dist/, which the package checks below reuse
        run: bun run test
        env:
          TEST_SQL_PASSWORD: "Test_Passw0rd!"
      - name: Validate protocol production package
        run: bash scripts/validate-protokoll-package.sh
      - name: Lint API
        working-directory: api
        run: bun run lint
      - name: Check operator scripts
        working-directory: api
        run: bunx tsc --noEmit --ignoreConfig --module Node16 --target ES2022 --moduleResolution Node16 --esModuleInterop --strict --types node scripts/*.ts
      - name: Validate Azure timer infrastructure
        run: az bicep build --file infrastructure/task-reminder-worker.bicep --outfile /tmp/task-reminder-worker.arm.json
      - name: Validate standalone timer package
        run: |
          bash scripts/package-task-worker.sh /tmp/task-reminder-build-check --use-built
          node -e "require('/tmp/task-reminder-build-check/dist/timers/task-reminders.js')"
  build:
    # One stable check name for branch protection over the website and API jobs. Skipped when
    # a newer push cancelled one of them (a manual cancel of the run still fails it).
    if: always() && ((github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]')) || (github.event_name == 'pull_request' && github.event.action != 'closed')) && !(contains(needs.*.result, 'cancelled') && !cancelled())
    needs: [build-web, check-web, api]
    runs-on: ubuntu-24.04
    name: Build
    steps:
      - name: Website and API passed
        run: |
          test "${{ needs.build-web.result }}" = success
          test "${{ needs.check-web.result }}" = success
          test "${{ needs.api.result }}" = success
  browser-tests:
    if: (github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]')) || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-24.04
    name: Browser tests (${{ matrix.name }})
    # A group per shard, so the shards of one run do not cancel each other
    concurrency:
      group: ci-browser-tests-${{ matrix.name }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && github.ref || github.run_id }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        # WebKit runs alone: its system packages take ~40 s to install, which the Chromium
        # shards would otherwise pay as well.
        include:
          - {
              name: "1/3",
              browser: chromium,
              args: "--project=desktop --project=mobile --shard=1/3",
            }
          - {
              name: "2/3",
              browser: chromium,
              args: "--project=desktop --project=mobile --shard=2/3",
            }
          - {
              name: "3/3",
              browser: chromium,
              args: "--project=desktop --project=mobile --shard=3/3",
            }
          # Its tests are a single file, which one worker (and one dev server) runs in order.
          - {
              name: "WebKit",
              browser: webkit,
              args: "--project=webkit-tablet",
              workers: 1,
            }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # Keyed on the browser builds Playwright pins, so unrelated dependency updates keep the cache.
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('web/node_modules/playwright-core/browsers.json') }}
      - name: Install ${{ matrix.browser }}
        working-directory: web
        # Downloads are skipped when the cache already holds this Playwright version's browser.
        run: bunx playwright install --with-deps ${{ matrix.browser }}
      - name: Test browser workflows with simulated data
        working-directory: web
        # Each shard runs its share of the test files with one mock dev server per worker.
        run: bun run test:e2e ${{ matrix.args }}
        env:
          E2E_WORKERS: ${{ matrix.workers || 4 }}
      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-report-${{ matrix.browser }}-${{ strategy.job-index }}
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
  browser-tests-result:
    # One stable check name for branch protection, independent of the number of shards. Skipped
    # when a newer push cancelled the shards (a manual cancel of the run still fails it).
    if: always() && ((github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]')) || (github.event_name == 'pull_request' && github.event.action != 'closed')) && !(needs.browser-tests.result == 'cancelled' && !cancelled())
    needs: [browser-tests]
    runs-on: ubuntu-24.04
    name: Browser tests
    steps:
      - name: All shards passed
        run: test "${{ needs.browser-tests.result }}" = success
  deploy:
    needs: [build, browser-tests]
    # PRs from forks get neither secrets nor OIDC tokens; skip them explicitly instead of
    # running their code up to a failing Azure login. PRs opened by bots (Dependabot) get no
    # preview either; Close Pull Request still runs for them and removes any leftovers.
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.type != 'Bot')
    runs-on: ubuntu-24.04
    name: Deploy
    concurrency:
      group: website-astro-deployment
      cancel-in-progress: false
      queue: max
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      # Close Pull Request shares the deployment group. If it ran first (the PR was closed while
      # this run built and tested), a deploy would bring back the preview and its database.
      - name: Skip the preview of a closed pull request
        id: open
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          state="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .state)"
          if [ "$state" = open ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::The pull request is $state; not deploying its preview."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.open.outputs.deploy != 'false'
      - name: Download build artifact
        if: steps.open.outputs.deploy != 'false'
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # Schema changes reach the database before the code that needs them (docs/azure-sql.md).
      # main migrates the production database; a missing SQL_MIGRATION_CLIENT_ID fails the
      # deploy instead of shipping code without its schema. Each PR preview gets a database of
      # its own with test data (website-pr-<number>); without SQL_PREVIEW_CLIENT_ID the preview
      # is not deployed rather than falling back to the production data.
      - name: Setup Bun (database)
        if: steps.open.outputs.deploy != 'false'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install API dependencies (database)
        if: steps.open.outputs.deploy != 'false'
        working-directory: api
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Azure login (database migrations)
        if: steps.open.outputs.deploy != 'false' && github.event_name == 'push'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.SQL_MIGRATION_CLIENT_ID }}
          tenant-id: ${{ vars.ENTRA_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Apply database migrations
        if: steps.open.outputs.deploy != 'false' && github.event_name == 'push'
        working-directory: api
        run: bun scripts/db-migrate.ts
      - name: Verify protocol cutover gate or current SQL import
        if: steps.open.outputs.deploy != 'false' && github.event_name == 'push'
        working-directory: api
        run: bun scripts/protokoll-migrate.ts --check
      - name: Azure login (preview database)
        if: steps.open.outputs.deploy != 'false' && github.event_name == 'pull_request'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.SQL_PREVIEW_CLIENT_ID }}
          tenant-id: ${{ vars.ENTRA_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Prepare preview database
        if: steps.open.outputs.deploy != 'false' && github.event_name == 'pull_request'
        working-directory: api
        # Creates, migrates and seeds website-pr-<number> and points this deployment at it
        run: bun scripts/db-preview.ts create "${{ github.event.pull_request.number }}" --write-deployment
      - name: Remove API modules
        if: steps.open.outputs.deploy != 'false'
        working-directory: api
        # The deploy action builds the API itself; it must not upload these modules
        run: rm -rf node_modules
      - name: Get Id Token
        if: steps.open.outputs.deploy != 'false'
        uses: actions/github-script@v7
        id: idtoken
        with:
          script: |
            return await core.getIDToken()
          result-encoding: string
      - name: Deploy to Azure Static Web Apps
        if: steps.open.outputs.deploy != 'false'
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ZEALOUS_WATER_04F606303 }}
          action: "upload"
          app_location: "dist"
          api_location: "api"
          output_location: ""
          skip_app_build: true
          github_id_token: ${{ steps.idtoken.outputs.result }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
      # Previews get their login callback registered in Entra, see docs/entra-preview-login.md.
      # Skipped until the repository variables are set.
      - name: Azure login (Entra)
        if: steps.open.outputs.deploy != 'false' && github.event_name == 'pull_request' && vars.ENTRA_DEPLOY_CLIENT_ID != ''
        uses: azure/login@v2
        with:
          client-id: ${{ vars.ENTRA_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.ENTRA_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Register preview login callback
        if: steps.open.outputs.deploy != 'false' && github.event_name == 'pull_request' && vars.ENTRA_DEPLOY_CLIENT_ID != ''
        env:
          ENTRA_WEBSITE_APP_OBJECT_ID: ${{ vars.ENTRA_WEBSITE_APP_OBJECT_ID }}
          PREVIEW_URL: ${{ steps.deploy.outputs.static_web_app_url }}
          FALLBACK_HOST: zealous-water-04f606303-${{ github.event.pull_request.number }}.westeurope.1.azurestaticapps.net
        run: |
          host="${PREVIEW_URL#https://}"
          host="${host%%/*}"
          .github/scripts/entra-preview-redirect.sh add "${host:-$FALLBACK_HOST}"
  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    name: Close Pull Request
    concurrency:
      group: website-astro-deployment
      cancel-in-progress: false
      queue: max
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - name: Get Id Token
        uses: actions/github-script@v7
        id: idtoken
        with:
          script: |
            return await core.getIDToken()
          result-encoding: string
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ZEALOUS_WATER_04F606303 }}
          action: "close"
          github_id_token: ${{ steps.idtoken.outputs.result }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
      # The base branch, not the PR: the merge ref of a PR closed with conflicts may not exist,
      # and the cleanup should run code that was reviewed
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install API dependencies (database)
        working-directory: api
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Azure login (preview database)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.SQL_PREVIEW_CLIENT_ID }}
          tenant-id: ${{ vars.ENTRA_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Drop preview database
        working-directory: api
        run: bun scripts/db-preview.ts drop "${{ github.event.pull_request.number }}"
      - name: Azure login (Entra)
        if: vars.ENTRA_DEPLOY_CLIENT_ID != ''
        uses: azure/login@v2
        with:
          client-id: ${{ vars.ENTRA_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.ENTRA_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Remove preview login callback
        if: vars.ENTRA_DEPLOY_CLIENT_ID != ''
        env:
          ENTRA_WEBSITE_APP_OBJECT_ID: ${{ vars.ENTRA_WEBSITE_APP_OBJECT_ID }}
        run: .github/scripts/entra-preview-redirect.sh remove "${{ github.event.pull_request.number }}"

  deploy-task-worker:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.TASK_REMINDER_FUNCTION_APP != ''
    needs: [deploy]
    name: Deploy Azure task timer
    runs-on: ubuntu-24.04
    # Runs no longer wait for each other, so the timer deploys of two merges could overlap;
    # their queue keeps the order of the website deploys.
    concurrency:
      group: task-reminder-deployment
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build standalone timer package
        run: bash scripts/package-task-worker.sh /tmp/task-reminder-worker
      - name: Azure login (timer deployment only)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.TASK_REMINDER_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.ENTRA_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy timer code
        env:
          FUNCTION_APP: ${{ vars.TASK_REMINDER_FUNCTION_APP }}
        run: az functionapp deployment source config-zip --resource-group website-astro --name "$FUNCTION_APP" --src /tmp/task-reminder-worker.zip --build-remote false --output none

  content-check:
    if: (github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    name: Check for new content
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      build: ${{ steps.check.outputs.build }}
      commit: ${{ steps.check.outputs.commit }}
      required: ${{ steps.check.outputs.required }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Compare live content with the deployed version
        id: check
        working-directory: web
        # Changes from the Pflege forms and manual runs always build
        run: bun scripts/content-check.ts ${{ github.event_name != 'schedule' && '--force' || '' }}

  content-build:
    needs: content-check
    if: needs.content-check.outputs.build == 'true'
    runs-on: ubuntu-24.04
    name: Build with current content
    timeout-minutes: 20
    permissions:
      contents: read
    # A newer change replaces a build that has not finished yet; started deploys are not affected
    concurrency:
      group: content-refresh-build
      cancel-in-progress: true
    outputs:
      commit: ${{ steps.switch.outputs.commit }}
    steps:
      - name: Wait for further changes
        # Someone editing several entries in a row causes one build instead of many
        if: github.event_name == 'repository_dispatch'
        run: sleep 90
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Switch to the deployed commit
        id: switch
        env:
          DEPLOYED_COMMIT: ${{ needs.content-check.outputs.commit }}
        # The commit is read from the live site, so only commits on main are accepted.
        # It always rebuilds the deployed commit, so code reaches the site only through a
        # push to main with its tests.
        run: |
          if [ -n "$DEPLOYED_COMMIT" ] && git merge-base --is-ancestor "$DEPLOYED_COMMIT" HEAD 2>/dev/null; then
            git checkout --quiet --detach "$DEPLOYED_COMMIT"
          else
            echo "::warning::Deployed commit '$DEPLOYED_COMMIT' is not on main; building main instead"
          fi
          commit="$(git rev-parse HEAD)"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "BUILD_COMMIT_SHA=$commit" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # No dependency cache: this job runs in the context of the default branch
      - name: Install dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      # Same commit as the last deploy of main, which passed lint and tests; only the content differs
      - name: Build
        working-directory: web
        run: bun run build
        env:
          CONTENT_SOURCE: live
          # Never remove content the deployed site has; a source that is down and missing there
          # as well does not block the other content
          CONTENT_STRICT: ${{ needs.content-check.outputs.required }}
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: content-dist
          path: web/dist
          retention-days: 1

  content-deploy:
    needs: content-build
    runs-on: ubuntu-24.04
    name: Deploy content
    concurrency:
      group: website-astro-deployment
      cancel-in-progress: false
      queue: max
    permissions:
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Skip if the code was deployed in the meantime
        id: current
        env:
          BUILT_COMMIT: ${{ needs.content-build.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
        # A newer deploy of main already contains the current content; ours would roll it back.
        # The deployed commit is the one of the newest push run whose Deploy job succeeded; that
        # job shares this concurrency group. stamm-phoenix.de is not asked, because Cloudflare
        # answers requests from runners with a bot check at random.
        # Fails closed: if the deployed commit cannot be read, nothing is deployed.
        run: |
          deployed=""
          if runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/azure-static-web-apps-zealous-water-04f606303.yml/runs?branch=main&event=push&per_page=100" --jq '.workflow_runs[] | select(.status == "completed") | "\(.id) \(.head_sha)"')"; then
            while read -r run sha; do
              [ -n "$run" ] || continue
              deploy="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs" --jq '[.jobs[] | select(.name == "Deploy")][0].conclusion // ""')" || break
              if [ "$deploy" = "success" ]; then deployed="$sha"; break; fi
            done <<< "$runs"
          fi
          if [ -z "$deployed" ]; then
            echo "::warning::Could not read the deployed commit; not deploying."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          elif [ "$deployed" != "$BUILT_COMMIT" ]; then
            echo "::warning::Deployed commit changed from $BUILT_COMMIT to $deployed; not deploying."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.current.outputs.deploy == 'true'
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Use the API of the built commit
        if: steps.current.outputs.deploy == 'true'
        env:
          BUILT_COMMIT: ${{ needs.content-build.outputs.commit }}
        # The build job only builds commits on main; checked again before the API is deployed
        run: |
          git merge-base --is-ancestor "$BUILT_COMMIT" HEAD
          git checkout --quiet --detach "$BUILT_COMMIT"
      - name: Download build artifact
        if: steps.current.outputs.deploy == 'true'
        uses: actions/download-artifact@v4
        with:
          name: content-dist
          path: dist
      - name: Get Id Token
        if: steps.current.outputs.deploy == 'true'
        uses: actions/github-script@v7
        id: idtoken
        with:
          script: |
            return await core.getIDToken()
          result-encoding: string
      - name: Deploy to Azure Static Web Apps
        if: steps.current.outputs.deploy == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ZEALOUS_WATER_04F606303 }}
          action: "upload"
          app_location: "dist"
          api_location: "api"
          output_location: ""
          skip_app_build: true
          github_id_token: ${{ steps.idtoken.outputs.result }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
