name: Protocol SQL cutover

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Read-only plan, or import, verify and activate production SQL
        required: true
        default: plan
        type: choice
        options:
          - plan
          - activate

permissions:
  contents: read

jobs:
  cutover:
    # Azure also enforces the existing main-branch OIDC subject (docs/azure-sql.md).
    if: github.ref == 'refs/heads/main'
    name: Protocol SQL cutover
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Keep activation and the final deployment probe away from competing uploads.
    concurrency:
      group: website-astro-deployment
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Install API dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Azure login (database migrations)
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.SQL_MIGRATION_CLIENT_ID }}
          tenant-id: ${{ vars.ENTRA_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Read-only migration plan
        run: bun scripts/protokoll-migrate.ts --plan
      - name: Import frozen SharePoint workflow metadata
        if: inputs.operation == 'activate'
        run: bun scripts/protokoll-migrate.ts --import
      - name: Verify imported metadata against SharePoint
        if: inputs.operation == 'activate'
        run: bun scripts/protokoll-migrate.ts --verify
      - name: Activate verified production SQL backend
        if: inputs.operation == 'activate'
        run: bun scripts/protokoll-migrate.ts --activate
