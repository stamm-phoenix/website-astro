name: Browser worker benchmark
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Run the whole desktop and mobile suite of this branch and of the default branch instead of the worker benchmark.
        type: boolean
        default: false
      head_only:
        description: With suite, measure only this branch (the baseline of an earlier run stays valid).
        type: boolean
        default: false
      repeat_filter:
        description: Repeat only the specs matching this regular expression (for example gestures-sheet) on this branch and on the default branch, without retries, instead of the worker benchmark or the suite.
        type: string
        default: ""
      repeat_each:
        description: With repeat_filter, how often every test runs.
        type: string
        default: "20"
      repeat_grep:
        description: With repeat_filter, only tests whose title matches this regular expression (empty for all).
        type: string
        default: ""
      repeat_project:
        description: With repeat_filter, the Playwright project.
        type: choice
        options: [desktop, mobile]
        default: desktop
permissions:
  contents: read
jobs:
  playwright-image:
    name: Playwright image
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      image: ${{ steps.version.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: web/package.json
          sparse-checkout-cone-mode: false
      - name: Read the Playwright version from web/package.json
        id: version
        run: |
          version=$(node -p "require('./web/package.json').devDependencies['@playwright/test'] || require('./web/package.json').dependencies['@playwright/test']")
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::@playwright/test in web/package.json must be an exact version, found: $version"
            exit 1
          fi
          echo "image=mcr.microsoft.com/playwright:v${version}-noble" >> "$GITHUB_OUTPUT"

  benchmark:
    if: ${{ !inputs.suite && inputs.repeat_filter == '' }}
    name: Browser benchmark (${{ matrix.workers }} workers)
    needs: playwright-image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        workers: [2, 4]
    container:
      image: ${{ needs.playwright-image.outputs.image }}
      options: --init --ipc=host
    defaults:
      run:
        shell: bash
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install Bun and frontend dependencies
        env:
          PLAYWRIGHT_IMAGE: ${{ needs.playwright-image.outputs.image }}
        run: |
          npm install --global bun@1.4.2
          bun install --frozen-lockfile
          test "$PLAYWRIGHT_IMAGE" = "mcr.microsoft.com/playwright:v$(node -p "require('@playwright/test/package.json').version")-noble"
      - name: Measure representative browser workflows
        run: >-
          bun run test:e2e --project=mobile
          'tests/(protokoll-editor|essensplanung-planung|aufgaben-dashboard|essensplanung-gerichte)[.]spec[.]ts$'
          --reporter=list,json
        env:
          E2E_WORKERS: ${{ matrix.workers }}
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/benchmark.json
      - name: Summarize measurement
        if: always()
        env:
          WORKERS: ${{ matrix.workers }}
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const file = 'test-results/benchmark.json';
          if (!fs.existsSync(file)) process.exit(0);
          const { stats } = JSON.parse(fs.readFileSync(file, 'utf8'));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `${process.env.WORKERS} workers: ${(stats.duration / 1000).toFixed(1)} s; ` +
            `${stats.expected} passed, ${stats.unexpected} failed, ${stats.flaky} flaky.\n`);
          JS
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-benchmark-${{ matrix.workers }}
          path: web/test-results/
          retention-days: 7
  repeat:
    # The same tests many times without retries, on this branch and on the default branch, so that a
    # flaky test shows its first-attempt failure rate for both sources.
    if: ${{ !inputs.suite && inputs.repeat_filter != '' }}
    name: Repeat (${{ matrix.label }})
    needs: playwright-image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        label: [base, head]
    container:
      image: ${{ needs.playwright-image.outputs.image }}
      options: --init --ipc=host
    defaults:
      run:
        shell: bash
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - name: Use the default branch for the baseline
        if: matrix.label == 'base'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --depth=1 origin "$DEFAULT_BRANCH"
          git checkout --detach FETCH_HEAD
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install Bun and frontend dependencies
        run: |
          npm install --global bun@1.4.2
          bun install --frozen-lockfile
      - name: Build the site with the test data
        run: bun run build
        env:
          CONTENT_SOURCE: mock
          CONTENT_STRICT: "1"
      - name: Repeat the tests
        # Same server as the shards in CI. The filter is a positional argument; after a bare "--"
        # Playwright ignored it and ran the whole project.
        env:
          E2E_SERVER: built
          FILTER: ${{ inputs.repeat_filter }}
          REPEAT: ${{ inputs.repeat_each }}
          PROJECT: ${{ inputs.repeat_project }}
          GREP: ${{ inputs.repeat_grep }}
          E2E_WORKERS: 4
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/repeat.json
        run: bun run test:e2e --project="$PROJECT" --retries=0 --repeat-each="$REPEAT" --grep="$GREP" --reporter=list,json "$FILTER"
      - name: Summarize first-attempt failures per test
        if: always()
        env:
          LABEL: ${{ matrix.label }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          export SHA="$(git rev-parse HEAD)"
          node <<'JS'
          const fs = require('node:fs');
          const file = 'test-results/repeat.json';
          if (!fs.existsSync(file)) process.exit(0);
          const report = JSON.parse(fs.readFileSync(file, 'utf8'));
          const rows = new Map();
          const visit = (suite) => {
            for (const spec of suite.specs ?? []) {
              for (const test of spec.tests) {
                const row = rows.get(spec.title) ?? { runs: 0, failed: 0, first: '' };
                for (const result of test.results) {
                  if (result.status === 'skipped') continue;
                  row.runs++;
                  if (result.status !== 'passed') {
                    row.failed++;
                    row.first ||= (result.error?.message ?? '').split('\n')[0].slice(0, 120);
                  }
                }
                rows.set(spec.title, row);
              }
            }
            for (const child of suite.suites ?? []) visit(child);
          };
          report.suites.forEach(visit);
          const lines = [`### ${process.env.LABEL}: ${process.env.SHA}`, `${report.stats.expected} passed, ${report.stats.unexpected} failed in ${(report.stats.duration / 1000).toFixed(0)} s.`, '', '| Test | Runs | Failed | First error |', '|---|---|---|---|'];
          for (const [title, row] of rows) lines.push(`| ${title} | ${row.runs} | ${row.failed} | ${row.first.replace(/\|/g, '/')} |`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          JS
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-repeat-${{ matrix.label }}
          path: web/test-results/repeat.json
          retention-days: 14
  suite:
    # The whole suite of the dispatched commit and of the default branch, each on one runner, with the settings of the shards in CI, so that
    # two commits are measured under the same conditions: same image, same worker count, same
    # retries. Records the duration of every test per file and project (JSON reporter).
    if: ${{ inputs.suite }}
    name: Whole suite (${{ matrix.label }})
    needs: playwright-image
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.head_only && '[{"label":"head"}]' || '[{"label":"base"},{"label":"head"}]') }}
    container:
      image: ${{ needs.playwright-image.outputs.image }}
      options: --init --ipc=host
    defaults:
      run:
        shell: bash
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - name: Use the default branch for the baseline
        if: matrix.label == 'base'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --depth=1 origin "$DEFAULT_BRANCH"
          git checkout --detach FETCH_HEAD
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install Bun and frontend dependencies
        env:
          PLAYWRIGHT_IMAGE: ${{ needs.playwright-image.outputs.image }}
        run: |
          npm install --global bun@1.4.2
          bun install --frozen-lockfile
          test "$PLAYWRIGHT_IMAGE" = "mcr.microsoft.com/playwright:v$(node -p "require('@playwright/test/package.json').version")-noble"
      - name: Run desktop and mobile
        run: bun run test:e2e --project=desktop --project=mobile --reporter=json
        env:
          E2E_WORKERS: 4
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/suite.json
      - name: Summarize per file and project
        if: always()
        env:
          LABEL: ${{ matrix.label }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          export SHA="$(git rev-parse HEAD)"
          node <<'JS'
          const fs = require('node:fs');
          const file = 'test-results/suite.json';
          if (!fs.existsSync(file)) process.exit(0);
          const report = JSON.parse(fs.readFileSync(file, 'utf8'));
          const rows = new Map();
          const visit = (suite) => {
            for (const spec of suite.specs ?? []) {
              for (const test of spec.tests) {
                const key = `${test.projectName}/${spec.file}`;
                const row = rows.get(key) ?? { project: test.projectName, file: spec.file, tests: 0, skipped: 0, failed: 0, flaky: 0, seconds: 0 };
                row.tests++;
                if (test.status === 'skipped') row.skipped++;
                if (test.status === 'unexpected') row.failed++;
                if (test.status === 'flaky') row.flaky++;
                row.seconds += test.results.reduce((sum, result) => sum + result.duration, 0) / 1000;
                rows.set(key, row);
              }
            }
            for (const child of suite.suites ?? []) visit(child);
          };
          report.suites.forEach(visit);
          const list = [...rows.values()].sort((a, b) => b.seconds - a.seconds);
          const total = (project) => list.filter((r) => r.project === project);
          const sum = (items, field) => items.reduce((n, r) => n + r[field], 0);
          const lines = [
            `### ${process.env.LABEL}: ${process.env.SHA}`,
            `Wall clock ${(report.stats.duration / 1000).toFixed(0)} s; ${report.stats.expected} passed, ${report.stats.unexpected} failed, ${report.stats.flaky} flaky, ${report.stats.skipped} skipped.`,
            '',
            '| Project | Files | Tests | Skipped | Sum of test seconds |',
            '|---|---|---|---|---|',
            ...['desktop', 'mobile'].map((p) => `| ${p} | ${total(p).length} | ${sum(total(p), 'tests')} | ${sum(total(p), 'skipped')} | ${sum(total(p), 'seconds').toFixed(0)} |`),
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          fs.writeFileSync(`test-results/per-spec-${process.env.LABEL}.json`, JSON.stringify({ ref: process.env.SHA, stats: report.stats, rows: list }, null, 1));
          JS
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-suite-${{ matrix.label }}
          path: |
            web/test-results/suite.json
            web/test-results/per-spec-*.json
          retention-days: 14
