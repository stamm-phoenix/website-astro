name: E2E budget
# Fails when a pull request adds Playwright tests or spec files without the label "e2e-ok"
# (rule: AGENTS.md, "Welche Testebene?"). Reads only git objects with read-only rights, so it is
# safe for pull requests from forks. The label is read again whenever it is set or removed.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
permissions:
  contents: read
concurrency:
  group: e2e-budget-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  budget:
    name: E2E budget
    runs-on: ubuntu-24.04
    steps:
      # Checks out the merge of the PR into its base, so the count includes what main gained since
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Fetch base commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA"
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Compare E2E tests with the base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        working-directory: web
        run: bun scripts/ci/e2e-budget.ts "$BASE_SHA" HEAD
