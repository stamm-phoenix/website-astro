name: Content refresh
# Rebuilds the site with the current content of the API, without code changes: the public pages
# contain content baked at build time (see web/src/lib/content/). Triggered by the Pflege forms
# (repository_dispatch from api/lib/site-rebuild.ts), by hand, and by an hourly check that only
# builds when the content differs from the deployed version. It always rebuilds the deployed
# commit, so code reaches the site only through the main workflow with its tests.
on:
  schedule:
    - cron: "17 * * * *"
  repository_dispatch:
    types: [content-changed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    name: Check for new content
    timeout-minutes: 10
    outputs:
      build: ${{ steps.check.outputs.build }}
      commit: ${{ steps.check.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Compare live content with the deployed version
        id: check
        working-directory: web
        # Changes from the Pflege forms and manual runs always build
        run: bun scripts/content-check.ts ${{ github.event_name != 'schedule' && '--force' || '' }}

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-24.04
    name: Build with current content
    timeout-minutes: 20
    # A newer change replaces a build that has not finished yet; started deploys are not affected
    concurrency:
      group: content-refresh-build
      cancel-in-progress: true
    outputs:
      commit: ${{ steps.switch.outputs.commit }}
    steps:
      - name: Wait for further changes
        # Someone editing several entries in a row causes one build instead of many
        if: github.event_name == 'repository_dispatch'
        run: sleep 90
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Switch to the deployed commit
        id: switch
        env:
          DEPLOYED_COMMIT: ${{ needs.check.outputs.commit }}
        # The commit is read from the live site, so only commits on main are accepted
        run: |
          if [ -n "$DEPLOYED_COMMIT" ] && git merge-base --is-ancestor "$DEPLOYED_COMMIT" HEAD 2>/dev/null; then
            git checkout --quiet --detach "$DEPLOYED_COMMIT"
          else
            echo "::warning::Deployed commit '$DEPLOYED_COMMIT' is not on main; building main instead"
          fi
          commit="$(git rev-parse HEAD)"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "BUILD_COMMIT_SHA=$commit" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # No dependency cache: this job runs in the context of the default branch
      - name: Install dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      # Same commit as the last deploy of main, which passed lint and tests; only the content differs
      - name: Build
        working-directory: web
        run: bun run build
        env:
          CONTENT_SOURCE: live
          # Never replace a complete site with one that lacks content
          CONTENT_STRICT: "1"
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: web/dist
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    name: Deploy
    concurrency:
      group: website-astro-deployment-and-retention
      cancel-in-progress: false
      queue: max
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Skip if the code was deployed in the meantime
        id: current
        env:
          BUILT_COMMIT: ${{ needs.build.outputs.commit }}
        # A newer deploy of main already contains the current content; ours would roll it back.
        # Fails closed: if the deployed commit cannot be read, nothing is deployed.
        run: |
          if ! response="$(curl -fsS --max-time 20 https://stamm-phoenix.de/content-version.json)"; then
            echo "Could not read the deployed commit; skipping."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          elif ! deployed="$(jq -er '.commit | strings | select(length > 0)' <<< "$response")"; then
            echo "The deployed site names no commit; skipping."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          elif [ "$deployed" != "$BUILT_COMMIT" ]; then
            echo "Deployed commit changed from $BUILT_COMMIT to $deployed; skipping."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.current.outputs.deploy == 'true'
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Use the API of the built commit
        if: steps.current.outputs.deploy == 'true'
        env:
          BUILT_COMMIT: ${{ needs.build.outputs.commit }}
        # The build job only builds commits on main; checked again before the API is deployed
        run: |
          git merge-base --is-ancestor "$BUILT_COMMIT" HEAD
          git checkout --quiet --detach "$BUILT_COMMIT"
      - name: Download build artifact
        if: steps.current.outputs.deploy == 'true'
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Get Id Token
        if: steps.current.outputs.deploy == 'true'
        uses: actions/github-script@v7
        id: idtoken
        with:
          script: |
            return await core.getIDToken()
          result-encoding: string
      - name: Deploy to Azure Static Web Apps
        if: steps.current.outputs.deploy == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ZEALOUS_WATER_04F606303 }}
          action: "upload"
          app_location: "dist"
          api_location: "api"
          output_location: ""
          skip_app_build: true
          github_id_token: ${{ steps.idtoken.outputs.result }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
