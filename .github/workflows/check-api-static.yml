name: Check API static
on:
  workflow_call:
    inputs:
      use-cache:
        description: Take the package from the cache when main built one from the same inputs
        type: boolean
        default: false

# Lint, scripts, Bicep and packages; builds dist/ itself and produces the artifact `swa-api`,
# which the PR preview and the production deploy upload. The tests are in check-api.yml.
# Pushes to main save the package in the cache, keyed by the hash of its inputs. A pull request
# that changes none of them (use-cache) restores it, skips the build and checks, which then
# passed on main for exactly these inputs, and only uploads the artifact for its preview.
jobs:
  api-static:
    runs-on: ubuntu-24.04
    name: Check API static
    timeout-minutes: 15
    concurrency:
      group: ci-api-static-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && github.ref || github.run_id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      # Before anything is installed or built, so the hash covers only the sources. The
      # workflow is part of it because it pins the Bun and Node versions of the package.
      - name: Hash the package inputs
        id: key
        run: echo "key=swa-api-${{ runner.os }}-${{ hashFiles('api/**', '!api/test/**', 'scripts/package-swa-api.sh', '.github/workflows/check-api-static.yml') }}" >> "$GITHUB_OUTPUT"
      - name: Restore API deployment package
        id: cache
        if: inputs.use-cache
        uses: actions/cache/restore@v6
        with:
          path: /tmp/swa-api.tar.gz
          key: ${{ steps.key.outputs.key }}
      - name: Setup Bun
        if: steps.cache.outputs.cache-hit != 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Setup Node
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          check-latest: true
      - name: Install API dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: api
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build API
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: api
        # Builds dist/ (tsc and bundle), which the package checks below reuse
        run: bun run build
      - name: Validate protocol production package
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash scripts/validate-protokoll-package.sh
      - name: Lint API
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: api
        run: bun run lint
      - name: Check operator scripts
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: api
        run: bunx tsc --noEmit --ignoreConfig --module Node16 --target ES2022 --moduleResolution Node16 --esModuleInterop --strict --types node scripts/*.ts
      - name: Validate Azure timer infrastructure
        if: steps.cache.outputs.cache-hit != 'true'
        run: az bicep build --file infrastructure/task-reminder-worker.bicep --outfile /tmp/task-reminder-worker.arm.json
      - name: Validate standalone timer package
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          bash scripts/package-task-worker.sh /tmp/task-reminder-build-check --use-built
          node -e "require('/tmp/task-reminder-build-check/dist/timers/index.js')"
      - name: Verify runtime deployment configuration contracts
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: api
        run: node --test scripts/deployment-bundle.test.mjs
      - name: Prepare API deployment package
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          bash scripts/package-swa-api.sh /tmp/swa-api
          tar -czf /tmp/swa-api.tar.gz -C /tmp/swa-api .
      - name: Upload API deployment package
        uses: actions/upload-artifact@v7
        with:
          name: swa-api
          path: /tmp/swa-api.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - name: Save API deployment package
        if: github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: /tmp/swa-api.tar.gz
          key: ${{ steps.key.outputs.key }}
