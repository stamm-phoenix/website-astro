name: Check API
on:
  workflow_call:

# Two jobs run in parallel: the tests need the SQL Server and are the long one; everything else
# (lint, scripts, Bicep, packages) builds dist/ itself and produces the artifact `swa-api`.
jobs:
  api-test:
    runs-on: ubuntu-24.04
    name: Check API tests
    timeout-minutes: 15
    concurrency:
      group: ci-api-test-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && github.ref || github.run_id }}
      cancel-in-progress: true
    # The API tests of the Nikolaus data run against a real SQL Server (api/test/fixtures/database.ts)
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Test_Passw0rd!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Test_Passw0rd!' -Q 'SELECT 1' -b"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          check-latest: true
      - name: Install API test dependencies
        working-directory: api
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Test API
        working-directory: api
        run: bun run test
        env:
          TEST_SQL_PASSWORD: "Test_Passw0rd!"

  api-static:
    runs-on: ubuntu-24.04
    name: Check API static
    timeout-minutes: 15
    concurrency:
      group: ci-api-static-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && github.ref || github.run_id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          check-latest: true
      - name: Install API dependencies
        working-directory: api
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build API
        working-directory: api
        # Builds dist/ (tsc and bundle), which the package checks below reuse
        run: bun run build
      - name: Validate protocol production package
        run: bash scripts/validate-protokoll-package.sh
      - name: Lint API
        working-directory: api
        run: bun run lint
      - name: Check operator scripts
        working-directory: api
        run: bunx tsc --noEmit --ignoreConfig --module Node16 --target ES2022 --moduleResolution Node16 --esModuleInterop --strict --types node scripts/*.ts
      - name: Validate Azure timer infrastructure
        run: az bicep build --file infrastructure/task-reminder-worker.bicep --outfile /tmp/task-reminder-worker.arm.json
      - name: Validate standalone timer package
        run: |
          bash scripts/package-task-worker.sh /tmp/task-reminder-build-check --use-built
          node -e "require('/tmp/task-reminder-build-check/dist/timers/index.js')"
      - name: Verify runtime deployment configuration contracts
        working-directory: api
        run: node --test scripts/deployment-bundle.test.mjs
      - name: Prepare API deployment package
        run: |
          bash scripts/package-swa-api.sh /tmp/swa-api
          tar -czf /tmp/swa-api.tar.gz -C /tmp/swa-api .
      - name: Upload API deployment package
        uses: actions/upload-artifact@v7
        with:
          name: swa-api
          path: /tmp/swa-api.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
