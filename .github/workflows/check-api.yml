name: Check API
on:
  workflow_call:

# The API tests; they need the SQL Server and are the long part. The static checks and the
# artifact `swa-api` are in check-api-static.yml, a call of its own, so the PR preview can
# deploy without waiting for these tests (#565).
jobs:
  api-test:
    runs-on: ubuntu-24.04
    name: Check API tests
    timeout-minutes: 15
    concurrency:
      group: ci-api-test-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && github.ref || github.run_id }}
      cancel-in-progress: true
    # The API tests of the Nikolaus data run against a real SQL Server (api/test/fixtures/database.ts)
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Test_Passw0rd!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Test_Passw0rd!' -Q 'SELECT 1' -b"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          check-latest: true
      - name: Install API test dependencies
        working-directory: api
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Test API
        working-directory: api
        run: bun run test
        env:
          TEST_SQL_PASSWORD: "Test_Passw0rd!"
