name: Temporary protocol metadata cleanup

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Read-only verification, or clear verified legacy SharePoint values
        required: true
        default: plan
        type: choice
        options:
          - plan
          - cleanup

permissions:
  contents: read

jobs:
  cleanup:
    # The migration identity also enforces the existing main-branch OIDC subject.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: website-astro-deployment
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.SQL_MIGRATION_CLIENT_ID }}
          tenant-id: ${{ vars.ENTRA_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Read-only metadata plan
        run: bun scripts/protokoll-migrate.ts --plan
      - name: Verify SQL source snapshots
        if: inputs.operation == 'plan'
        run: bun scripts/protokoll-migrate.ts --verify
      - name: Freeze protocol requests
        if: inputs.operation == 'cleanup'
        run: bun scripts/protokoll-migrate.ts --freeze
      - name: Clear verified legacy workflow values
        if: inputs.operation == 'cleanup'
        run: bun scripts/protokoll-migrate.ts --cleanup --sql-live
      - name: Verify cleaned source and retained SQL metadata
        if: inputs.operation == 'cleanup'
        run: bun scripts/protokoll-migrate.ts --verify
      - name: Reactivate verified SQL protocol backend
        if: inputs.operation == 'cleanup'
        run: bun scripts/protokoll-migrate.ts --activate
